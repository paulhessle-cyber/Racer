<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Race Predictor</title>

<style>
body { font-family: Arial; background:#111; color:#eee; margin:0; }
.nav { display:flex; background:#222; }
.tab { flex:1; padding:12px; text-align:center; cursor:pointer; }
.tab.on { background:#00c853; color:#000; }

.scr { display:none; padding:15px; }
.scr.on { display:block; }

.card { background:#1b1b1b; padding:12px; margin-bottom:10px; border-radius:6px; }

button { padding:10px; width:100%; background:#00c853; border:none; margin-top:10px; }

input { width:100%; padding:6px; margin-top:4px; }

textarea { width:100%; height:120px; }
</style>
</head>

<body>

<div class="nav">
  <div class="tab on" onclick="go('races')">Races</div>
  <div class="tab" onclick="go('predict')">Predict</div>
</div>

<!-- RACES -->
<div class="scr on" id="races">
  <div class="card">
    <button onclick="loadDemo()">Load Demo Race</button>
  </div>

  <div id="raceList"></div>
</div>

<!-- PREDICT -->
<div class="scr" id="predict">
  <div id="runnerList"></div>

  <div class="card">
    <textarea id="pasteOdds" placeholder="Paste ATR odds here"></textarea>
    <button onclick="applyPastedOdds()">Apply Odds</button>
  </div>

  <button onclick="predict()">Predict</button>

  <div id="results"></div>
</div>

<script>
// STATE
const S = { races: [], sel: null };

// NAV
function go(tab){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));

  document.getElementById(tab).classList.add('on');
  event.target.classList.add('on');
}

// DEMO DATA
function loadDemo(){
  S.races = [{
    name: "Demo Race",
    runners: [
      {stall:1,name:"Madame De Sevigne",odds:0},
      {stall:2,name:"Mereside Diva",odds:0},
      {stall:3,name:"Lady Manzor",odds:0}
    ]
  }];

  renderRaceList();
}

// RACE LIST
function renderRaceList(){
  const el = document.getElementById('raceList');
  el.innerHTML = '';

  S.races.forEach((r,i)=>{
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = r.name;
    d.onclick = ()=>selectRace(i);
    el.appendChild(d);
  });
}

// SELECT RACE
function selectRace(i){
  S.sel = S.races[i];
  renderRunners();
  go('predict');
}

// RUNNERS UI
function renderRunners(){
  const el = document.getElementById('runnerList');
  el.innerHTML = '';

  S.sel.runners.forEach(r=>{
    const d = document.createElement('div');
    d.className = 'card';

    d.innerHTML = `
      <strong>${r.name}</strong>
      <input id="od_${r.stall}" placeholder="Odds">
    `;

    el.appendChild(d);
  });
}

// 🔥 FIXED ODDS PARSER
function applyPastedOdds(){
  const text = document.getElementById('pasteOdds').value;
  if (!text || !S.sel) return;

  const lines = text
    .replace(/\t/g,'\n')
    .replace(/\r/g,'\n')
    .split('\n')
    .map(l=>l.trim())
    .filter(Boolean);

  let matched = 0;

  for(let i=0;i<lines.length;i++){
    let line = lines[i];

    if(!/^\d+(\.\d+)?$/.test(line)) continue;

    let odds = parseFloat(line);

    if(odds > 20 && !line.includes('.')) continue;

    let jockey=null, horse=null;

    for(let j=i-1;j>=0;j--){
      let l = lines[j];

      if(!jockey && /[A-Za-z]/.test(l) && l.includes(' ')){
        jockey = l;
        continue;
      }

      if(jockey && l.length > 3){
        horse = l;
        break;
      }
    }

    if(!horse) continue;

    horse = horse
      .replace(/\(.*?\)/g,'')
      .replace(/[^a-zA-Z\s']/g,'')
      .trim()
      .toUpperCase();

    const runner = S.sel.runners.find(r=>{
      const key = r.name.toUpperCase();
      return key.includes(horse.substring(0,6)) ||
             horse.includes(key.substring(0,6));
    });

    if(runner){
      runner.odds = odds;
      document.getElementById('od_'+runner.stall).value = odds;
      matched++;
    }
  }

  alert(`Applied odds to ${matched} runners`);
}

// SIMPLE PREDICTION
function predict(){
  if(!S.sel) return;

  let res = S.sel.runners
    .map(r=>{
      let odds = parseFloat(document.getElementById('od_'+r.stall).value)||0;
      return {...r, odds, score: odds?1/odds:0};
    })
    .sort((a,b)=>b.score-a.score);

  document.getElementById('results').innerHTML =
    res.map((r,i)=>`${i+1}. ${r.name} (${r.odds})`).join('<br>');
}
</script>

</body>
</html>
