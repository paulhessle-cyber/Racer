<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formintel — Results & Backtesting</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green:#00e676;--gold:#ffc107;--red:#ff5252;--blue:#448aff;--orange:#ff6d00;
    --bg:#07090b;--sf:#0d1410;--bd:#1c2a1e;--text:#c8dece;--mt:#4a6a55;--white:#eef6f0;
    --mono:'IBM Plex Mono',monospace;
    /* Short-name aliases used throughout the JS-rendered HTML. Without these,
       75+ references (every won-green, card panel, etc) fell back to defaults —
       which is why WON naps weren't showing green. */
    --g:#00e676;--re:#ff5252;--tx:#c8dece;--card:#0d1410;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px}

  /* Header */
  .hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;
       border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:10}
  .hdr h1{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:1px;color:var(--green)}
  .hdr-sub{font-family:var(--mono);font-size:.6rem;color:var(--mt);text-transform:uppercase;letter-spacing:2px}

  /* Tab bar */
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;border-bottom:1px solid var(--bd);background:var(--bd);position:sticky;top:57px;z-index:9}
  .tab-btn{padding:10px 6px;font-family:var(--mono);font-size:.58rem;text-transform:uppercase;
           letter-spacing:1px;text-align:center;color:var(--mt);cursor:pointer;border:none;
           background:transparent;border-bottom:2px solid transparent;transition:all .2s}
  .tab-btn.active{color:var(--green);border-bottom-color:var(--green)}

  /* Import */
  .import-zone{margin:16px;padding:24px 20px;border:2px dashed var(--bd);border-radius:12px;
               text-align:center;cursor:pointer;transition:all .2s;position:relative}
  .import-zone:hover{border-color:var(--green);background:rgba(0,230,118,.04)}
  .import-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .import-icon{font-size:2rem;margin-bottom:8px}
  .import-title{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--white);margin-bottom:4px}
  .import-sub{font-family:var(--mono);font-size:.62rem;color:var(--mt);line-height:1.7}
  .import-sub b{color:var(--green)}

  .ls-btn{display:block;width:calc(100% - 32px);margin:0 16px 16px;padding:12px;border-radius:8px;
          border:1px solid var(--bd);background:rgba(255,255,255,.02);color:var(--text);
          font-family:var(--mono);font-size:.65rem;text-transform:uppercase;letter-spacing:1px;cursor:pointer}
  .ls-btn:hover{border-color:var(--green);color:var(--green)}

  /* Stat cards */
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px}
  .stat-card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;
             padding:14px 12px;text-align:center;position:relative;overflow:hidden}
  .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:10px 10px 0 0}
  .stat-card.win::before{background:var(--green)}.stat-card.place::before{background:var(--gold)}
  .stat-card.loss::before{background:var(--red)}.stat-card.total::before{background:var(--blue)}
  .stat-card.rank::before{background:var(--mt)}.stat-card.streak::before{background:var(--orange)}
  .stat-num{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;line-height:1;margin-bottom:4px}
  .win .stat-num{color:var(--green)}.place .stat-num{color:var(--gold)}.loss .stat-num{color:var(--red)}
  .total .stat-num{color:var(--blue)}.rank .stat-num{color:var(--mt)}.streak .stat-num{color:var(--orange)}
  .stat-label{font-family:var(--mono);font-size:.55rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--mt);line-height:1.3}

  /* Chart */
  .chart-wrap{margin:0 16px 16px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px}
  .chart-title{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:2px;color:var(--mt);margin-bottom:14px}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .bar-label{font-family:var(--mono);font-size:.65rem;color:var(--text);width:52px;flex-shrink:0}
  .bar-track{flex:1;height:20px;background:rgba(255,255,255,.04);border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;
            font-family:var(--mono);font-size:.6rem;font-weight:600;white-space:nowrap;min-width:2px}
  .bar-fill.win{background:linear-gradient(90deg,#00c853,#00e676);color:#000}
  .bar-fill.place{background:linear-gradient(90deg,#ff8f00,#ffc107);color:#000}
  .bar-fill.loss{background:linear-gradient(90deg,#c62828,#ff5252);color:#fff}
  .bar-pct{font-family:var(--mono);font-size:.65rem;color:var(--text);width:36px;text-align:right;flex-shrink:0}

  /* Section header */
  .section-hdr{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:2px;
               color:var(--mt);padding:0 16px 10px;display:flex;align-items:center;gap:8px}
  .section-hdr::before{content:'';display:block;width:20px;height:1px;background:var(--green)}

  /* Filter bar */
  .filter-bar{display:flex;gap:8px;padding:0 16px 14px;overflow-x:auto;scrollbar-width:none}
  .filter-bar::-webkit-scrollbar{display:none}
  .filter-btn{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:1px;
              padding:6px 14px;border-radius:20px;border:1px solid var(--bd);background:transparent;
              color:var(--mt);cursor:pointer;white-space:nowrap;transition:all .2s}
  .filter-btn.active{background:rgba(0,230,118,.12);border-color:rgba(0,230,118,.4);color:var(--green)}

  /* Race cards */
  .races{padding:0 16px;display:flex;flex-direction:column;gap:10px}
  .race-card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;overflow:hidden;animation:fadeIn .3s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .race-card.win{border-left:3px solid var(--green)}.race-card.place{border-left:3px solid var(--gold)}.race-card.loss{border-left:3px solid #333}
  .race-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
  .race-name{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--white);letter-spacing:.5px}
  .race-meta{font-family:var(--mono);font-size:.58rem;color:var(--mt);margin-top:2px}
  .race-badge{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:1px;padding:4px 10px;border-radius:20px;font-weight:600}
  .badge-win{background:rgba(0,230,118,.15);color:var(--green);border:1px solid rgba(0,230,118,.3)}
  .badge-place{background:rgba(255,193,7,.12);color:var(--gold);border:1px solid rgba(255,193,7,.3)}
  .badge-loss{background:rgba(255,82,82,.08);color:#666;border:1px solid #222}
  .race-body{padding:0 14px 12px;display:flex;flex-direction:column;gap:5px}
  .race-row{display:flex;align-items:baseline;gap:8px}
  .race-row-label{font-family:var(--mono);font-size:.58rem;color:var(--mt);text-transform:uppercase;letter-spacing:1px;width:52px;flex-shrink:0}
  .race-row-val{color:var(--text);font-size:.82rem}
  .rank-1{color:var(--green);font-weight:600}.rank-2{color:var(--gold)}.rank-3{color:#cd7f32}.rank-bad{color:var(--mt)}
  .preds-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
  .pred-chip{font-family:var(--mono);font-size:.58rem;padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.04);border:1px solid var(--bd);color:var(--mt)}
  .pred-chip.is-winner{background:rgba(0,230,118,.12);border-color:rgba(0,230,118,.3);color:var(--green)}
  .pred-chip.is-placed{background:rgba(255,193,7,.1);border-color:rgba(255,193,7,.25);color:var(--gold)}

  /* Backtesting */
  .bt-wrap{padding:0 16px}
  .bt-card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:12px}
  .bt-title{font-family:var(--mono);font-size:.65rem;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}

  .bt-controls{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .bt-control-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
  .bt-input-wrap{flex:1;min-width:100px}
  .bt-input-label{font-family:var(--mono);font-size:.55rem;color:var(--mt);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
  .bt-input{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:6px;
            color:var(--text);font-family:var(--mono);font-size:.8rem;padding:8px 10px;outline:none}
  .bt-input:focus{border-color:var(--green)}
  .bt-run{width:100%;padding:11px;border-radius:8px;border:none;background:rgba(0,230,118,.15);
          border:1px solid rgba(0,230,118,.3);color:var(--green);font-family:var(--mono);
          font-size:.65rem;text-transform:uppercase;letter-spacing:2px;cursor:pointer;font-weight:600}
  .bt-run:hover{background:rgba(0,230,118,.25)}

  /* Strategy comparison table */
  .strat-table{width:100%;border-collapse:collapse;font-size:.72rem}
  .strat-table th{font-family:var(--mono);font-size:.55rem;text-transform:uppercase;letter-spacing:1px;
                  color:var(--mt);padding:6px 8px;text-align:left;border-bottom:1px solid var(--bd)}
  .strat-table td{padding:8px 8px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top}
  .strat-table tr:last-child td{border-bottom:none}
  .strat-name{font-family:var(--mono);font-size:.68rem;color:var(--text);font-weight:600}
  .strat-detail{font-family:var(--mono);font-size:.58rem;color:var(--mt);margin-top:2px}
  .profit-pos{color:var(--green);font-family:var(--mono);font-weight:600}
  .profit-neg{color:var(--red);font-family:var(--mono)}
  .profit-neu{color:var(--mt);font-family:var(--mono)}

  /* P&L curve */
  .pnl-curve{width:100%;height:120px;margin-top:12px;position:relative}
  .pnl-svg{width:100%;height:100%}

  /* Threshold finder */
  .threshold-rows{display:flex;flex-direction:column;gap:6px;margin-top:4px}
  .threshold-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;
                 padding:6px 8px;border-radius:6px;background:rgba(255,255,255,.03);
                 border:1px solid var(--bd);font-family:var(--mono);font-size:.65rem}
  .threshold-row.best{background:rgba(0,230,118,.07);border-color:rgba(0,230,118,.25)}
  .threshold-row-hdr{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;
                     padding:4px 8px;font-family:var(--mono);font-size:.55rem;
                     text-transform:uppercase;letter-spacing:1px;color:var(--mt)}

  .reset-btn{display:block;margin:16px 16px 0;width:calc(100% - 32px);padding:12px;border-radius:8px;
             border:1px solid var(--bd);background:transparent;color:var(--mt);font-family:var(--mono);
             font-size:.65rem;text-transform:uppercase;letter-spacing:2px;cursor:pointer}
  .reset-btn:hover{border-color:var(--gold);color:var(--gold)}

  .tab-content{display:none}
  .tab-content.active{display:block}

  /* Bet tracker modal & legs */
  .modal-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--white);
               letter-spacing:.5px;margin-bottom:14px}
  .modal-row{display:flex;gap:8px;margin-bottom:10px}
  .leg-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .leg-num{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--mt);
           width:20px;flex-shrink:0;text-align:center}
  .leg-name{flex:1;min-width:100px}
  .leg-result{display:flex;gap:4px;flex-shrink:0}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1>Formintel Results</h1>
    <div class="hdr-sub" id="subtitle">No data loaded</div>
  </div>
  <div style="font-size:1.6rem">📊</div>
</div>

<div class="tabs" id="tab-bar" style="display:none">
  <button class="tab-btn active" onclick="showTab('overview')">Overview</button>
  <button class="tab-btn" onclick="showTab('backtest')">Backtest</button>
  <button class="tab-btn" onclick="showTab('races')">Race Log</button>
  <button class="tab-btn" onclick="showTab('bets')">💰 Bets</button>
  <button class="tab-btn" onclick="showTab('insights')">🔬 Insights</button>
  <button class="tab-btn" onclick="showTab('bf')">👀 BF Watch</button>
  <button class="tab-btn" onclick="showTab('value')">💰 Value</button>
  <button class="tab-btn" onclick="showTab('placepot')">🎯 Placepot</button>
  <button class="tab-btn" onclick="showTab('dutch')">💷 Dutching</button>
  <button class="tab-btn" onclick="showTab('nap')">⭐ Nap</button>
  <button class="tab-btn" onclick="showTab('conf')">🎯 Confidence</button>
</div>

<div id="app">
  <!-- Import shown before data loads -->
</div>

<script>
var LOG_KEY = 'rq_pred_log_v1';
var loadedLog = null;
var currentFilter = 'all';
var currentTab = 'overview';

// ── Utilities ───────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function classify(e){ return e.topPickWon?'win':e.topPickPlaced?'place':'loss'; }
function pct(n,t){ return t?Math.round(n/t*100)+'%':'0%'; }
function fmt(n){ return (n>=0?'+':'')+n.toFixed(2); }

function tryLocalStorage() {
  try {
    var raw = localStorage.getItem(LOG_KEY);
    if (raw){ var d=JSON.parse(raw); if(Array.isArray(d)&&d.length) return d; }
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.indexOf('rq_pred')>-1){
        try{ var d2=JSON.parse(localStorage.getItem(k)); if(Array.isArray(d2)&&d2.length&&d2[0].raceKey) return d2; }catch(e2){}
      }
    }
  } catch(e){}
  return null;
}

function tryLS() {
  var data = tryLocalStorage();
  if (data) { loadedLog=data; showTab('overview'); renderAll(); }
  else alert('No Formintel results found in storage.\n\nExport from the Predictor via ⬇ Export Results JSON then import here.');
}

function loadFile(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!Array.isArray(data)||!data.length) throw new Error('Empty or invalid file');
      if (!data[0].raceKey) throw new Error('Not a Formintel results file');
      loadedLog = data;
      showTab('overview');
      renderAll();
    } catch(err) { alert('Could not read file: '+err.message); }
  };
  reader.readAsText(file);
}

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(function(b,i){
    b.classList.toggle('active', ['overview','backtest','races','bets','insights','bf','value','placepot','dutch','nap','conf'][i]===tab);
  });
  document.querySelectorAll('.tab-content').forEach(function(c){
    c.classList.remove('active');
  });
  var el = document.getElementById('tab-'+tab);
  if (el) el.classList.add('active');
  // Always re-render bets tab so it picks up localStorage saves from predictor
  if (tab === 'bets') renderBets();
  if (tab === 'insights') renderInsights();
  if (tab === 'bf') renderBFWatch();
  if (tab === 'value') renderValueTab();
  if (tab === 'placepot') renderPlacepotTab();
  if (tab === 'dutch') renderDutchTab();
  if (tab === 'nap') renderNapTab();
  if (tab === 'conf') renderConfTab();
}

function resetData(){ loadedLog=null; currentFilter='all'; document.getElementById('tab-bar').style.display='none'; renderImport(); }
function setFilter(val){ currentFilter=val; renderRaces(); }

// ── Main render ─────────────────────────────────────────────
function renderAll() {
  var log = loadedLog;
  if (!log||!log.length){ renderImport(); return; }

  document.getElementById('tab-bar').style.display='grid';
  var sorted = log.slice().sort(function(a,b){
    return (b.date||'').localeCompare(a.date||'') || (b.time||'').localeCompare(a.time||'');
  });

  var total  = sorted.length;
  var wins   = sorted.filter(function(e){return e.topPickWon;}).length;
  var places = sorted.filter(function(e){return !e.topPickWon&&e.topPickPlaced;}).length;
  var losses = total-wins-places;

  var maxStreak=0,curStreak=0;
  sorted.forEach(function(e,i){
    if(i===0||(classify(e)!=='loss')===(classify(sorted[i-1])!=='loss')) curStreak++;
    else curStreak=1;
    if(curStreak>maxStreak) maxStreak=curStreak;
  });

  var ranked=sorted.filter(function(e){return e.winnerRank>0;});
  var avgRank=ranked.length?(ranked.reduce(function(s,e){return s+e.winnerRank;},0)/ranked.length).toFixed(1):'-';

  document.getElementById('subtitle').textContent = total+' race'+(total!==1?'s':'')+' logged';

  var app = document.getElementById('app');
  app.innerHTML =
    '<div class="tab-content active" id="tab-overview">' + renderOverview(sorted,total,wins,places,losses,avgRank,maxStreak) + '</div>' +
    '<div class="tab-content" id="tab-backtest">' + renderBacktest(sorted) + '</div>' +
    '<div class="tab-content" id="tab-races" id="tab-races"></div>' +
    '<div class="tab-content" id="tab-bets"></div>' +
    '<div class="tab-content" id="tab-insights"></div>' +
    '<div class="tab-content" id="tab-bf"></div>' +
    '<div class="tab-content" id="tab-value"></div>' +
    '<div class="tab-content" id="tab-placepot"></div>' +
    '<div class="tab-content" id="tab-dutch"></div>' +
    '<div class="tab-content" id="tab-nap"></div>' +
    '<div class="tab-content" id="tab-conf"></div>';

  renderRaces();
  runDefaultBacktest(sorted);
  renderBets();
  renderInsights();
}

// ── Overview tab ────────────────────────────────────────────
function renderOverview(sorted,total,wins,places,losses,avgRank,maxStreak) {
  var h = '<div class="summary">';
  h += sc('win',   pct(wins,total),  'Win<br>Rate');
  h += sc('place', pct(places,total),'Place<br>Rate');
  h += sc('loss',  pct(losses,total),'Loss<br>Rate');
  h += sc('total', total,            'Races<br>Logged');
  h += sc('rank',  avgRank,          'Avg Winner<br>Rank');
  h += sc('streak',maxStreak,        'Best<br>Streak');
  h += '</div>';

  h += '<div class="chart-wrap"><div class="chart-title">Result Breakdown</div>';
  h += br('Wins',   wins,   total, 'win');
  h += br('Places', places, total, 'place');
  h += br('Losses', losses, total, 'loss');
  h += '</div>';

  // P&L curve (flat £1 stake)
  h += '<div class="chart-wrap">';
  h += '<div class="chart-title">Running P&L — Flat £1 Win Stake</div>';
  h += buildPnlCurve(sorted, function(e){ return e.topPickWon; }, function(e){ return e.topPickOdds||0; });
  h += '</div>';

  h += renderMonthlyTable(sorted);

  return h;
}

// ── Monthly performance table ────────────────────────────────────────────────
// Month-by-month win/place/loss split and flat £1 P&L, so you can see whether
// the model is actually improving rather than judging it on a single day.
function renderMonthlyTable(rows) {
  var priced = (rows || []).filter(function(e){ return e && e.date && (e.topPickOdds || 0) > 1; });
  if (priced.length < 20) return '';

  var byMonth = {};
  priced.forEach(function(e){
    var m = String(e.date).slice(0,7);
    if (!byMonth[m]) byMonth[m] = { n:0, w:0, p:0, ret:0 };
    var b = byMonth[m];
    b.n++;
    if (e.topPickWon) { b.w++; b.ret += (e.topPickOdds || 0); }
    else if (e.topPickPlaced) { b.p++; }
  });

  var months = Object.keys(byMonth).sort();
  if (months.length < 2) return '';

  // Format money with the sign OUTSIDE the £, so a loss reads -£2.00 not £-2.00
  function money(v){ return (v < 0 ? '-£' : '+£') + Math.abs(v).toFixed(2); }

  var MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function label(m){
    var parts = m.split('-');
    return (MN[parseInt(parts[1],10)-1] || m) + ' ' + parts[0];
  }

  // Best/worst ROI months for highlighting
  var rois = months.map(function(m){ var b=byMonth[m]; return (b.ret-b.n)/b.n*100; });
  var bestRoi = Math.max.apply(null, rois), worstRoi = Math.min.apply(null, rois);

  var h = '<div class="chart-wrap">';
  h += '<div class="chart-title">Monthly Performance — Is The Model Improving?</div>';
  h += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.62rem">';
  h += '<tr style="color:var(--mt);text-align:right">'
     + '<th style="text-align:left;padding:6px 4px;font-weight:400">Month</th>'
     + '<th style="padding:6px 4px;font-weight:400">Races</th>'
     + '<th style="padding:6px 4px;font-weight:400">Won</th>'
     + '<th style="padding:6px 4px;font-weight:400">Plc</th>'
     + '<th style="padding:6px 4px;font-weight:400">Lost</th>'
     + '<th style="padding:6px 4px;font-weight:400">Win%</th>'
     + '<th style="padding:6px 4px;font-weight:400">£1 P/L</th>'
     + '<th style="padding:6px 4px;font-weight:400">ROI</th></tr>';

  var tn=0, tw=0, tp=0, tret=0;
  months.forEach(function(m){
    var b = byMonth[m];
    var lost = b.n - b.w - b.p;
    var pl = b.ret - b.n;
    var roi = pl / b.n * 100;
    tn+=b.n; tw+=b.w; tp+=b.p; tret+=b.ret;
    var plCol = pl >= 0 ? 'var(--g)' : 'var(--re)';
    // subtle highlight on the best and worst months
    var bg = (roi === bestRoi) ? 'rgba(0,230,118,0.07)' : (roi === worstRoi) ? 'rgba(255,82,82,0.06)' : 'transparent';
    h += '<tr style="text-align:right;border-top:1px solid var(--bd);background:' + bg + '">'
       + '<td style="text-align:left;padding:7px 4px;color:var(--tx);font-weight:600">' + label(m) + '</td>'
       + '<td style="padding:7px 4px;color:var(--mt)">' + b.n + '</td>'
       + '<td style="padding:7px 4px;color:var(--g)">' + b.w + '</td>'
       + '<td style="padding:7px 4px;color:var(--gold)">' + b.p + '</td>'
       + '<td style="padding:7px 4px;color:var(--mt)">' + lost + '</td>'
       + '<td style="padding:7px 4px;color:var(--tx)">' + (b.w/b.n*100).toFixed(1) + '%</td>'
       + '<td style="padding:7px 4px;color:' + plCol + '">' + money(pl) + '</td>'
       + '<td style="padding:7px 4px;color:' + plCol + ';font-weight:700">' + (roi>=0?'+':'') + roi.toFixed(1) + '%</td></tr>';
  });

  var tpl = tret - tn, troi = tpl / tn * 100;
  var tCol = tpl >= 0 ? 'var(--g)' : 'var(--re)';
  h += '<tr style="text-align:right;border-top:2px solid var(--bd)">'
     + '<td style="text-align:left;padding:7px 4px;color:var(--tx);font-weight:700">All</td>'
     + '<td style="padding:7px 4px;color:var(--mt)">' + tn + '</td>'
     + '<td style="padding:7px 4px;color:var(--g)">' + tw + '</td>'
     + '<td style="padding:7px 4px;color:var(--gold)">' + tp + '</td>'
     + '<td style="padding:7px 4px;color:var(--mt)">' + (tn-tw-tp) + '</td>'
     + '<td style="padding:7px 4px;color:var(--tx)">' + (tw/tn*100).toFixed(1) + '%</td>'
     + '<td style="padding:7px 4px;color:' + tCol + '">' + money(tpl) + '</td>'
     + '<td style="padding:7px 4px;color:' + tCol + ';font-weight:700">' + (troi>=0?'+':'') + troi.toFixed(1) + '%</td></tr>';
  h += '</table></div>';

  // Trend read-out: compare the most recent full-ish month against the first
  if (months.length >= 3) {
    var firstRoi = rois[0], lastRoi = rois[rois.length-1];
    var firstWin = byMonth[months[0]].w / byMonth[months[0]].n * 100;
    var lastWin  = byMonth[months[months.length-1]].w / byMonth[months[months.length-1]].n * 100;
    var dRoi = lastRoi - firstRoi, dWin = lastWin - firstWin;
    var arrow = dRoi > 0 ? '▲' : dRoi < 0 ? '▼' : '■';
    var col = dRoi > 0 ? 'var(--g)' : dRoi < 0 ? 'var(--re)' : 'var(--mt)';
    h += '<div style="font-family:var(--mono);font-size:.6rem;color:var(--mt);padding:10px 4px 2px;line-height:1.6">'
       + '<span style="color:' + col + ';font-weight:700">' + arrow + ' ' + label(months[0]) + ' → ' + label(months[months.length-1]) + '</span>'
       + '&nbsp; win rate ' + (dWin>=0?'+':'') + dWin.toFixed(1) + ' pts'
       + ' · ROI ' + (dRoi>=0?'+':'') + dRoi.toFixed(1) + ' pts<br>'
       + 'Note: months with few races swing wildly — judge the trend on months with 300+ races.'
       + '</div>';
  }

  h += '</div>';
  return h;
}

function buildPoints(chronological, wonFn, oddsFn, skipNoOdds) {
  var pnl = 0, points = [0], bets = 0;
  chronological.forEach(function(e) {
    var o = oddsFn(e);
    if (skipNoOdds && (!o || o <= 1)) return; // skip races where fav had no odds
    bets++;
    if (wonFn(e) && o > 1) pnl += o - 1;
    else pnl -= 1;
    points.push(Math.round(pnl*100)/100);
  });
  return { points: points, bets: bets, pnl: pnl };
}

function buildPnlCurve(sorted, wonFn, oddsFn) {
  var chronological = sorted.slice().reverse();

  // Model top pick line
  var model = buildPoints(chronological, wonFn, oddsFn, false);

  // Market favourite line — only for races where favOdds was recorded
  var hasFavData = sorted.some(function(e){ return e.favOdds > 1; });
  var fav = hasFavData
    ? buildPoints(chronological,
        function(e){ return !!e.favWon; },
        function(e){ return e.favOdds || 0; },
        true)
    : null;

  // Scale both lines on the same axis
  var allPoints = model.points.concat(fav ? fav.points : []);
  var minP = Math.min.apply(null, allPoints);
  var maxP = Math.max.apply(null, allPoints);
  var range = maxP - minP || 1;
  var W = 100, H = 100;

  function toSvgPts(points) {
    return points.map(function(p, i) {
      var x = (i / (points.length - 1 || 1)) * W;
      var y = H - ((p - minP) / range) * H;
      return x + ',' + y;
    }).join(' ');
  }

  var zeroY  = H - ((0 - minP) / range) * H;
  var mCol   = model.pnl >= 0 ? '#00e676' : '#ff5252';
  var fCol   = '#448aff'; // always blue for favourite

  var svg = '<svg class="pnl-svg" viewBox="0 0 100 100" preserveAspectRatio="none">'
    + '<line x1="0" y1="' + zeroY + '" x2="100" y2="' + zeroY
    + '" stroke="rgba(255,255,255,.15)" stroke-width=".5"/>'
    + '<polyline points="' + toSvgPts(model.points)
    + '" fill="none" stroke="' + mCol + '" stroke-width="1.4"/>';

  if (fav && fav.points.length > 1) {
    svg += '<polyline points="' + toSvgPts(fav.points)
      + '" fill="none" stroke="' + fCol + '" stroke-width="1.2" stroke-dasharray="3,2"/>';
  }
  svg += '</svg>';

  // Legend + summary
  var label = '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-family:var(--mono);font-size:.62rem">';
  label += '<span style="color:' + mCol + '">— Model pick &nbsp; ' + fmt(model.pnl)
    + ' P&L &nbsp; ROI ' + (model.bets ? Math.round(model.pnl / model.bets * 100) : 0) + '%</span>';
  if (fav && fav.points.length > 1) {
    label += '<span style="color:' + fCol + '">- - Favourite &nbsp; ' + fmt(fav.pnl)
      + ' P&L &nbsp; ROI ' + (fav.bets ? Math.round(fav.pnl / fav.bets * 100) : 0) + '%</span>';
  } else if (!hasFavData) {
    label += '<span style="color:var(--mt)">Favourite line needs new results (odds must be entered before predicting)</span>';
  }
  label += '<span style="color:var(--mt)">'+sorted.length+' races · £1 flat stake</span>';
  label += '</div>';

  return '<div class="pnl-curve">' + svg + '</div>' + label;
}

function ctrl(label, id, val, type, min, max, step) {
  return '<div class="bt-input-wrap">'
    + '<div class="bt-input-label">'+label+'</div>'
    + '<input class="bt-input" id="'+id+'" type="'+type+'" value="'+val+'"'
    + (min?' min="'+min+'"':'') + (max?' max="'+max+'"':'') + (step?' step="'+step+'"':'')
    + '></div>';
}

function getVal(id, def) {
  var el = document.getElementById(id);
  return el ? (parseFloat(el.value)||def) : def;
}

function simulateStrategy(log, minConf, minOdds, maxOdds, valueOnly, stake) {
  var bets=0, wins=0, pnl=0, points=[0];
  var chron = log.slice().reverse();

  chron.forEach(function(e) {
    var conf = (e.topPickConf||0); // stored as percentage (0-100), not decimal
    var odds = e.topPickOdds||0;
    if (conf < minConf) return;
    if (odds < minOdds || odds > maxOdds) return;
    if (valueOnly) {
      var implied = odds>0 ? 1/odds : 0;
      if ((e.topPickConf||0)/100 < implied) return; // model doesn't beat market
    }
    bets++;
    var staked = stake;
    if (e.topPickWon && odds>1) {
      pnl += (odds-1)*staked;
      wins++;
    } else {
      pnl -= staked;
    }
    points.push(Math.round(pnl*100)/100);
  });

  return { bets:bets, wins:wins, pnl:pnl, roi: bets?pnl/(bets*stake)*100:0, points:points };
}

function runBacktest() {
  if (!loadedLog) return;
  var minConf = getVal('bt-min-conf', 0);
  var minOdds = getVal('bt-min-odds', 1.5);
  var maxOdds = getVal('bt-max-odds', 99);
  var stake   = getVal('bt-stake', 1);
  var res     = simulateStrategy(loadedLog, minConf, minOdds, maxOdds, btValueOnly, stake);

  var col = res.pnl >= 0 ? 'var(--green)' : 'var(--red)';
  var el  = document.getElementById('bt-results');
  if (!el) return;

  var h = '<div style="border-top:1px solid var(--bd);padding-top:14px;margin-top:14px">';
  h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px">';
  h += mini('Bets', res.bets);
  h += mini('Wins', res.wins);
  h += mini('Strike', res.bets?Math.round(res.wins/res.bets*100)+'%':'—');
  h += mini2('P&L', fmt(res.pnl), col);
  h += mini2('ROI', (res.roi>=0?'+':'')+Math.round(res.roi)+'%', col);
  h += mini('Staked', '£'+(res.bets*stake).toFixed(0));
  h += '</div>';

  if (res.bets > 1) {
    // Mini P&L curve
    var W=100,H=60, pts=res.points, minP=Math.min.apply(null,pts), maxP=Math.max.apply(null,pts);
    var range=maxP-minP||1;
    var svgPts = pts.map(function(p,i){
      return (i/(pts.length-1||1)*W)+','+(H-((p-minP)/range*H));
    }).join(' ');
    var zY = H-((0-minP)/range*H);
    h += '<svg style="width:100%;height:60px" viewBox="0 0 100 60" preserveAspectRatio="none">'
      + '<line x1="0" y1="'+zY+'" x2="100" y2="'+zY+'" stroke="rgba(255,255,255,.15)" stroke-width=".5"/>'
      + '<polyline points="'+svgPts+'" fill="none" stroke="'+col+'" stroke-width="1.5"/>'
      + '</svg>';
  } else {
    h += '<div style="font-family:var(--mono);font-size:.7rem;color:var(--mt);text-align:center;padding:10px">No bets matched these filters</div>';
  }

  h += '</div>';
  el.innerHTML = h;
}

function runDefaultBacktest(sorted) {
  if (!sorted||!sorted.length) return;

  // Threshold finder
  var thEl = document.getElementById('bt-threshold');
  if (thEl) {
    var thresholds = [0,10,15,20,25,30,35,40];
    var rows = thresholds.map(function(t) {
      return Object.assign({ threshold:t }, simulateStrategy(sorted, t, 1.5, 99, false, 1));
    });
    var bestROI = Math.max.apply(null, rows.filter(function(r){return r.bets>=5;}).map(function(r){return r.roi;}));

    var h = '<div class="threshold-row-hdr"><span>Min Conf</span><span>Bets</span><span>Strike</span><span>ROI</span></div>';
    h += '<div class="threshold-rows">';
    rows.forEach(function(r) {
      var isBest = r.bets>=5 && Math.abs(r.roi-bestROI)<0.1;
      var col = r.roi>0?'var(--green)':r.roi<0?'var(--red)':'var(--mt)';
      h += '<div class="threshold-row'+(isBest?' best':'')+'">'
        + '<span style="color:var(--text)">'+r.threshold+'%+'+(isBest?' 🏆':'')+' </span>'
        + '<span style="color:var(--mt)">'+r.bets+'</span>'
        + '<span style="color:var(--mt)">'+(r.bets?Math.round(r.wins/r.bets*100)+'%':'—')+'</span>'
        + '<span style="color:'+col+'">'+(r.roi>=0?'+':'')+Math.round(r.roi)+'%</span>'
        + '</div>';
    });
    h += '</div>';
    thEl.innerHTML = h;
  }

  // Odds range breakdown
  var orEl = document.getElementById('bt-odds-range');
  if (orEl) {
    var ranges = [
      {label:'Evens–2/1', min:1.5, max:3.0},
      {label:'2/1–4/1',   min:3.0, max:5.0},
      {label:'4/1–6/1',   min:5.0, max:7.0},
      {label:'6/1–10/1',  min:7.0, max:11.0},
      {label:'10/1–16/1', min:11.0, max:17.0},
      {label:'16/1+',     min:17.0, max:999},
    ];
    var h2 = '<div class="threshold-row-hdr"><span>Odds Range</span><span>Bets</span><span>Strike</span><span>ROI</span></div>';
    h2 += '<div class="threshold-rows">';
    ranges.forEach(function(range) {
      var r = simulateStrategy(sorted, 0, range.min, range.max, false, 1);
      var col = r.roi>0?'var(--green)':r.roi<0?'var(--red)':'var(--mt)';
      h2 += '<div class="threshold-row">'
        + '<span style="color:var(--text)">'+range.label+'</span>'
        + '<span style="color:var(--mt)">'+r.bets+'</span>'
        + '<span style="color:var(--mt)">'+(r.bets?Math.round(r.wins/r.bets*100)+'%':'—')+'</span>'
        + '<span style="color:'+col+'">'+(r.roi>=0?'+':'')+Math.round(r.roi)+'%</span>'
        + '</div>';
    });
    h2 += '</div>';
    orEl.innerHTML = h2;
  }
}

function mini(label, val) {

function renderRaces() {
  if (!loadedLog) return;
  var el = document.getElementById('tab-races');
  if (!el) return;

  var sorted = loadedLog.slice().sort(function(a,b){
    return (b.date||'').localeCompare(a.date||'') || (b.time||'').localeCompare(a.time||'');
  });
  var total  = sorted.length;
  var wins   = sorted.filter(function(e){return e.topPickWon;}).length;
  var places = sorted.filter(function(e){return !e.topPickWon&&e.topPickPlaced;}).length;
  var losses = total-wins-places;
  var filtered = currentFilter==='all' ? sorted : sorted.filter(function(e){return classify(e)===currentFilter;});

  var h = '<div class="filter-bar">';
  [['all','All ('+total+')'],['win','🟢 Wins ('+wins+')'],['place','🟡 Places ('+places+')'],['loss','🔴 Losses ('+losses+')']].forEach(function(fb){
    h += '<button class="filter-btn'+(currentFilter===fb[0]?' active':'')+'" onclick="setFilter(\''+fb[0]+'\')">'+fb[1]+'</button>';
  });
  h += '</div><div class="races">';

  if (!filtered.length) {
    h += '<div style="text-align:center;padding:30px;color:var(--mt);font-family:var(--mono);font-size:.75rem">No '+currentFilter+' results yet</div>';
  }

  filtered.forEach(function(entry,idx){
    var cls   = classify(entry);
    var badge = cls==='win'   ? '<span class="race-badge badge-win">✓ Win</span>'
              : cls==='place' ? '<span class="race-badge badge-place">◎ Place</span>'
              :                 '<span class="race-badge badge-loss">✗ Loss</span>';

    var rCls = entry.winnerRank===1?'rank-1':entry.winnerRank===2?'rank-2':entry.winnerRank===3?'rank-3':'rank-bad';
    var rTxt = entry.winnerRank>0 ? '<span class="'+rCls+'">#'+entry.winnerRank+'</span> in predictions' : 'Winner not in top picks';
    var preds  = entry.predictions||[];
    var actual = entry.actual||[];
    var chips  = preds.slice(0,5).map(function(p,i){
      var iW=actual[0]&&p.name===actual[0],iP=actual.indexOf(p.name)>-1;
      var cc=iW?' is-winner':iP?' is-placed':'';
      var sc=p.score?' '+Math.round(p.score*100)+'%':'';
      return '<span class="pred-chip'+cc+'">'+(i+1)+'. '+esc(p.name)+sc+'</span>';
    }).join('');

    var course=[entry.course,entry.time,entry.dist].filter(Boolean).join(' · ');
    var conf = entry.topPickConf ? Math.round(entry.topPickConf*100)+'%' : '—';
    var odds = entry.topPickOdds ? entry.topPickOdds.toFixed(1) : '—';

    h += '<div class="race-card '+cls+'" style="animation-delay:'+(idx*.03)+'s">';
    h += '<div class="race-top"><div><div class="race-name">'+esc(course)+'</div>';
    h += '<div class="race-meta">'+esc(entry.date||'')+(entry.going?' · '+esc(entry.going):'')+' · Conf '+conf+' · Odds '+odds+'</div></div>'+badge+'</div>';
    h += '<div class="race-body">';
    h += '<div class="race-row"><span class="race-row-label">Winner</span><span class="race-row-val">'+esc((actual[0])||'—')+'</span></div>';
    h += '<div class="race-row"><span class="race-row-label">Top Pick</span><span class="race-row-val">'+esc(preds[0]?preds[0].name:'—')+'</span></div>';
    h += '<div class="race-row"><span class="race-row-label">Rank</span><span class="race-row-val">'+rTxt+'</span></div>';
    if (chips) h += '<div class="preds-list">'+chips+'</div>';
    h += '</div></div>';
  });

  h += '</div><button class="reset-btn" onclick="resetData()">↩ Load Different File</button>';
  el.innerHTML = h;
}

var BETS_KEY = 'rq_bets_v1';

function refreshBets() {
  // Force re-read from localStorage and re-render
  renderBets();
}

function getBetLog() {
  try {
    var raw = localStorage.getItem(BETS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

function saveBetLog(log) {
  try { localStorage.setItem(BETS_KEY, JSON.stringify(log)); } catch(e) {}
}

function exportBetLog() {
  var log = getBetLog();
  if (!log.length) { alert('No bets logged yet.'); return; }
  var blob = new Blob([JSON.stringify(log, null, 2)], {type:'application/json'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url;
  a.download = 'formintel_bets_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function importBetFile(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var incoming = JSON.parse(e.target.result);
      if (!Array.isArray(incoming)) throw new Error('Invalid format');

      // Merge with existing bets — don't overwrite, add new ones only
      var existing = getBetLog();
      var existingIds = {};
      existing.forEach(function(b){ existingIds[b.id] = true; });

      var added = 0;
      incoming.forEach(function(b) {
        if (!existingIds[b.id]) {
          existing.push(b);
          added++;
        }
      });

      saveBetLog(existing);
      renderBets();

      if (added === 0) {
        alert('No new bets to add — all ' + incoming.length + ' bets already in your log.');
      } else {
        alert('Added ' + added + ' new bet(s). ' + (incoming.length - added) + ' already existed.');


      }
    } catch(err) { alert('Could not read file: ' + err.message); }
  };
  reader.readAsText(file);
}

// ── L15 return calculation ────────────────────────────
function calcL15Return(legs, unit, isEW, placeFrac) {
  // legs: array of {odds, won, placed} — 4 items
  // Returns actual cash back
  var ret = 0;
  var n   = legs.length;
  var wo  = legs.map(function(l){ return l.won ? l.odds : 0; });
  var po  = legs.map(function(l){
    return (l.won || l.placed) ? (l.odds - 1) * placeFrac + 1 : 0;
  });

  function combos(arr, size) {
    var result = [];
    (function pick(start, chosen) {
      if (chosen.length === size) { result.push(chosen.slice()); return; }
      for (var i = start; i < arr.length; i++) { chosen.push(i); pick(i+1, chosen); chosen.pop(); }
    })(0, []);
    return result;
  }

  for (var size = 1; size <= n; size++) {
    combos(Array.from({length:n},function(_,i){return i;}), size).forEach(function(idxs) {
      var wProd = idxs.reduce(function(p,i){ return p * wo[i]; }, 1);
      var pProd = idxs.reduce(function(p,i){ return p * po[i]; }, 1);
      if (wProd > 0) ret += unit * wProd;
      if (isEW && pProd > 0) ret += unit * pProd;
    });
  }
  return Math.round(ret * 100) / 100;
}

// ── Placepot return ───────────────────────────────────
function calcPlacepotReturn(legs, stake) {
  // All 6 legs must place. Return = stake x pool dividend
  // We can't know the pool dividend in advance, so we track
  // whether it won and the actual return the user enters
  var allPlaced = legs.every(function(l){ return l.placed || l.won; });
  return allPlaced ? null : 0; // null = user must enter actual return
}

function saveBet(type) {
  var isL15  = type === 'l15';
  var nLegs  = isL15 ? 4 : 6;
  var date   = document.getElementById('bet-date').value || new Date().toISOString().slice(0,10);
  var stake  = parseFloat(document.getElementById('bet-stake').value) || 1;
  var legs   = [];

  for (var i = 0; i < nLegs; i++) {
    var nameEl = document.getElementById('leg-name-' + i);
    var oddsEl = document.getElementById('leg-odds-' + i);
    var name   = nameEl ? nameEl.value.trim() : '';
    var odds   = oddsEl ? (parseFloat(oddsEl.value) || 0) : 0;
    var result = legResults[i] || 'pending';
    legs.push({ name:name, odds:odds, result:result,
                won: result==='won', placed: result==='placed'||result==='won' });
  }

  var actualReturn = 0;
  if (isL15) {
    var isEW     = betModalType === 'ew';
    var placeFrac = betModalPlace === 'fifth' ? 0.2 : 0.25;
    var unit     = isEW ? stake / 30 : stake / 15;
    actualReturn = calcL15Return(legs, unit, isEW, placeFrac);
  } else {
    var retEl = document.getElementById('bet-return');
    actualReturn = retEl ? (parseFloat(retEl.value) || 0) : 0;
  }

  var hasPending = legs.some(function(l){ return l.result==='pending'; });
  var bet = {
    id:           editingBetId || ('bet_' + Date.now()),
    type:         type,
    date:         date,
    stake:        stake,
    legs:         legs,
    actualReturn: actualReturn,
    profit:       Math.round((actualReturn - stake) * 100) / 100,
    pending:      hasPending,
    isEW:         isL15 ? betModalType==='ew' : false,
    placeFrac:    isL15 ? (betModalPlace==='fifth' ? 0.2 : 0.25) : 0.25,
  };

  var log = getBetLog();
  if (editingBetId) {
    var idx2 = log.findIndex(function(b){ return b.id === editingBetId; });
    if (idx2 > -1) log[idx2] = bet; else log.push(bet);
  } else {
    log.push(bet);
  }
  saveBetLog(log);
  legResults = {};
  closeModal();
  renderBets();
}

// ── Render Bets tab ───────────────────────────────────
// ── Auto-settle bets from the results log ────────────────────────────────────
// Bet legs store a horse name; loadedLog already knows every race's winner and
// placed horses. So instead of tapping Won/Placed/Lost on each leg by hand, we
// match names and fill the results in. Only touches legs still 'pending' — a
// result you set yourself is never overwritten.
function normHorse(n) {
  return String(n || '')
    .toUpperCase()
    .replace(/\s*\([A-Z]{2,3}\)\s*$/,'')   // strip country suffix (IRE), (FR)
    .replace(/[^A-Z0-9]/g,'')                // punctuation/apostrophes/spaces
    .trim();
}

// Build a lookup of every horse we know a result for.
// Returns { NORMNAME: {result, date, course, time, placesKnown} }
function buildResultIndex() {
  var idx = {};
  (loadedLog || []).forEach(function(e){
    var act = e.actual || [];
    if (!act.length) return;
    // act[0] is the winner; the rest are placed (order not guaranteed).
    // With only 1-2 names we know the winner but NOT the full place list.
    var placesKnown = act.length >= 3;
    act.forEach(function(nm, i){
      var k = normHorse(nm);
      if (!k) return;
      idx[k] = { result: i === 0 ? 'won' : 'placed', date: e.date || '',
                 course: e.course || '', time: e.time || '', placesKnown: placesKnown };
    });
    // Losers: any runner we predicted that isn't in the result list.
    (e.predictions || []).forEach(function(p){
      var k = normHorse(p.name);
      if (!k || idx[k]) return;
      // Only safe to call it a loser if we know the full frame
      if (placesKnown) {
        idx[k] = { result: 'lost', date: e.date || '', course: e.course || '',
                   time: e.time || '', placesKnown: true };
      }
    });
  });
  return idx;
}

function autoSettleBets(silent) {
  var log = getBetLog();
  if (!log.length) { if (!silent) alert('No bets to settle yet.'); return 0; }
  if (!loadedLog || !loadedLog.length) {
    if (!silent) alert('Load your results first — the Bets tab settles from the results log.');
    return 0;
  }

  var idx = buildResultIndex();
  var legsFilled = 0, betsChanged = 0, unmatched = [];

  log.forEach(function(bet){
    var changed = false;
    (bet.legs || []).forEach(function(leg){
      if (!leg || !leg.name) return;
      if (leg.result && leg.result !== 'pending') return;   // never overwrite a manual call
      var hit = idx[normHorse(leg.name)];
      if (!hit) { unmatched.push(leg.name); return; }
      leg.result = hit.result;
      legsFilled++; changed = true;
    });
    if (!changed) return;
    betsChanged++;
    // Recompute the bet's standing
    bet.pending = (bet.legs || []).some(function(l){ return !l.result || l.result === 'pending'; });
    if (!bet.pending && bet.type === 'l15' && typeof calcL15Return === 'function') {
      try {
        bet.actualReturn = calcL15Return(bet.legs, bet.unit, bet.isEW, bet.placeFrac);
        bet.profit = Math.round((bet.actualReturn - bet.stake) * 100) / 100;
      } catch(err) {}
    }
    // Placepot returns are dividend-based, so they still need entering by hand.
  });

  if (legsFilled) { saveBetLog(log); renderBets(); }

  if (!silent) {
    var msg = legsFilled
      ? ('Settled ' + legsFilled + ' leg' + (legsFilled!==1?'s':'') + ' across ' + betsChanged + ' bet' + (betsChanged!==1?'s':'') + '.')
      : 'Nothing new to settle.';
    if (unmatched.length) {
      var uniq = unmatched.filter(function(v,i,a){ return a.indexOf(v)===i; });
      msg += '\n\nNot found in results (' + uniq.length + '): ' + uniq.slice(0,6).join(', ')
           + (uniq.length>6 ? '…' : '')
           + '\n\nThese are usually races the app never logged, or a spelling difference.';
    }
    if (legsFilled && log.some(function(b){ return b.type==='placepot' && !b.pending; })) {
      msg += '\n\nPlacepot returns are dividend-based — enter those amounts yourself.';
    }
    alert(msg);
  }
  return legsFilled;
}

    + '</label>';
h += '<button onclick="autoSettleBets(false)" style="width:100%;padding:11px;margin-bottom:12px;border-radius:8px;'
    + 'border:1px solid rgba(68,138,255,.35);background:rgba(68,138,255,.1);color:var(--blue);'
    + 'font-family:var(--mono);font-size:.62rem;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:1px">'
    + '⚡ Auto-settle from results</button>';
h += '<div style="display:flex;gap:8px;margin-bottom:16px">';
  h += '<button onclick="openAddBet(&apos;l15&apos;)" style="flex:1;padding:11px;border-radius:8px;border:1px solid rgba(0,230,118,.3);background:rgba(0,230,118,.1);color:var(--green);font-family:var(--mono);font-size:.62rem;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:1px">⚡ + Lucky 15</button>';
  h += '<button onclick="openAddBet(&apos;placepot&apos;)" style="flex:1;padding:11px;border-radius:8px;border:1px solid rgba(255,193,7,.3);background:rgba(255,193,7,.08);color:var(--gold);font-family:var(--mono);font-size:.62rem;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:1px">🎯 + Placepot</button>';

  h += betStat('Total Returned',  '£' + totalReturned.toFixed(2),'var(--blue)');
  var pCol = totalProfit>=0 ? 'var(--green)' : 'var(--red)';
  h += betStat('Overall P&L',     (totalProfit>=0?'+':'')+'£'+Math.abs(totalProfit).toFixed(2), pCol);
  h += betStat('ROI',             (roi>=0?'+':'')+roi+'%', pCol);
  h += '</div>';

  // Split summary by type

function betStat(label, val, col) {

    + '</div>';
}

function typeBlock(label, bets) {
  var staked   = bets.reduce(function(s,b){return s+b.stake;},0);
  var returned = bets.filter(function(b){return !b.pending;}).reduce(function(s,b){return s+b.actualReturn;},0);
  var profit   = returned - staked;
  var col      = profit>=0 ? 'var(--green)' : 'var(--red)';
  return '<div style="background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:12px">'
    + '<div style="font-family:var(--mono);font-size:.6rem;color:var(--mt);margin-bottom:6px">' + label + ' (' + bets.length + ')</div>'
    + '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:1.4rem;color:' + col + '">'
    + (profit>=0?'+':'')+'£'+Math.abs(profit).toFixed(2) + '</div>'
    + '<div style="font-family:var(--mono);font-size:.58rem;color:var(--mt)">£'+staked.toFixed(2)+' staked</div>'
    + '</div>';
}

function buildBetPnlCurve(log) {
  var chron  = log.slice().reverse();
  var pnl    = 0;
  var l15pnl = 0, pppnl = 0;
  var pts=[[0,0,0]]; // [combined, l15, placepot]
  var l15c=0, ppc=0;

  chron.forEach(function(b) {
    if (b.pending) return;
    pnl    += b.profit;
    if (b.type==='l15')       { l15pnl += b.profit; l15c++; }
    else if (b.type==='placepot') { pppnl  += b.profit; ppc++; }
    pts.push([Math.round(pnl*100)/100, Math.round(l15pnl*100)/100, Math.round(pppnl*100)/100]);
  });

  if (pts.length < 2) return '<div style="font-family:var(--mono);font-size:.7rem;color:var(--mt);text-align:center;padding:12px">Settle bets to see P&L curve</div>';

  var allVals = pts.reduce(function(a,p){ return a.concat(p); }, []);
  var minV    = Math.min.apply(null, allVals);
  var maxV    = Math.max.apply(null, allVals);
  var range   = maxV - minV || 1;
  var W=100, H=80;

  function toLine(colIdx) {
    return pts.map(function(p,i){
      return (i/(pts.length-1||1)*W)+','+(H-((p[colIdx]-minV)/range*H));
    }).join(' ');
  }

  var zY    = H - ((0 - minV) / range * H);
  var fPnl  = pts[pts.length-1][0];
  var fCol  = fPnl >= 0 ? '#00e676' : '#ff5252';

  var svg = '<svg style="width:100%;height:80px" viewBox="0 0 100 80" preserveAspectRatio="none">'
    + '<line x1="0" y1="'+zY+'" x2="100" y2="'+zY+'" stroke="rgba(255,255,255,.15)" stroke-width=".5"/>';
  if (l15c > 0) svg += '<polyline points="'+toLine(1)+'" fill="none" stroke="#00e676" stroke-width="1" stroke-dasharray="3,2"/>';
  if (ppc  > 0) svg += '<polyline points="'+toLine(2)+'" fill="none" stroke="#ffc107" stroke-width="1" stroke-dasharray="3,2"/>';
  svg += '<polyline points="'+toLine(0)+'" fill="none" stroke="'+fCol+'" stroke-width="1.6"/>';
  svg += '</svg>';

  var legend = '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-family:var(--mono);font-size:.6rem">';
  legend += '<span style="color:'+fCol+'">— Total '+fmt(fPnl)+'</span>';
  if (l15c>0) legend += '<span style="color:var(--green)">-- L15 '+fmt(l15pnl)+'</span>';
  if (ppc>0)  legend += '<span style="color:var(--gold)">-- Placepot '+fmt(pppnl)+'</span>';
  legend += '</div>';

  return svg + legend;
}

function buildBetCard(bet) {
  var isL15  = bet.type === 'l15';
  var icon   = isL15 ? '⚡' : '🎯';
  var typeL  = isL15 ? 'Lucky 15' : 'Placepot';
  var won    = bet.legs.filter(function(l){return l.won;}).length;
  var placed = bet.legs.filter(function(l){return l.placed&&!l.won;}).length;
  var profit = bet.profit;
  var pCol   = profit > 0 ? 'var(--green)' : profit < 0 ? 'var(--red)' : 'var(--mt)';
  var bdrCol = profit > 0 ? 'var(--green)' : profit < 0 ? '#333' : 'var(--bd)';

  var h = '<div style="background:var(--sf);border:1px solid var(--bd);border-left:3px solid '
    + bdrCol + ';border-radius:10px;margin-bottom:10px;overflow:hidden">';

  // Header
  h += '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px">';
  h += '<div>';
  h += '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:1.1rem;color:var(--white)">'
    + icon + ' ' + typeL + ' &nbsp;'
    + '<span style="font-family:var(--mono);font-size:.6rem;color:var(--mt)">' + bet.date + '</span>'
    + (bet.pending ? ' <span style="font-family:var(--mono);font-size:.58rem;color:var(--gold)">PENDING</span>' : '')
    + '</div>';
  h += '<div style="font-family:var(--mono);font-size:.6rem;color:var(--mt);margin-top:2px">'
    + '£' + bet.stake.toFixed(2) + ' staked'
    + (isL15 ? ' · ' + (bet.isEW ? 'E/W' : 'Win') : '')
    + (isL15 && bet.isEW ? ' · ' + (bet.placeFrac===0.2?'1/5':'1/4') : '')
    + '</div>';
  h += '</div>';
  h += '<div style="text-align:right">';
  if (!bet.pending) {
    h += '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:1.5rem;color:'+pCol+'">'
      + (profit>=0?'+':'') + '£' + Math.abs(profit).toFixed(2) + '</div>';
    h += '<div style="font-family:var(--mono);font-size:.58rem;color:var(--mt)">£'+bet.actualReturn.toFixed(2)+' returned</div>';
  } else {
    h += '<div style="font-family:var(--mono);font-size:.65rem;color:var(--gold)">In progress</div>';
  }
  h += '</div></div>';

  // Legs
  h += '<div style="padding:0 14px 10px;display:grid;grid-template-columns:1fr 1fr;gap:4px">';
  bet.legs.forEach(function(leg, i) {
    var lCol = leg.won ? 'var(--green)' : leg.placed ? 'var(--gold)' : leg.result==='lost' ? 'var(--mt)' : 'var(--mt)';
    var lIcon = leg.won ? '✓' : leg.placed ? '◎' : leg.result==='lost' ? '✗' : '⏳';
    h += '<div style="font-family:var(--mono);font-size:.62rem;color:'+lCol+';padding:2px 0">'
      + lIcon + ' ' + esc(leg.name||('Leg '+(i+1)))
      + (isL15 && leg.odds ? ' <span style="opacity:.6">@'+leg.odds+'</span>' : '')
      + '</div>';
  });
  h += '</div>';

  // Edit/Delete
  h += '<div style="display:flex;gap:6px;padding:0 14px 12px">';
  h += '<button onclick="editBet(&apos;' + bet.id + '&apos;)" style="flex:1;padding:7px;border-radius:6px;border:1px solid var(--bd);background:transparent;color:var(--mt);font-family:var(--mono);font-size:.6rem;cursor:pointer">✏ Edit</button>';
  h += '<button onclick="deleteBet(&apos;' + bet.id + '&apos;)" style="padding:7px 12px;border-radius:6px;border:1px solid rgba(255,82,82,.2);background:transparent;color:rgba(255,82,82,.6);font-family:var(--mono);font-size:.6rem;cursor:pointer">🗑</button>';
  h += '</div>';

  h += '</div>';
  return h;
}

// Analyses logged race results to find where the model is

function parseDist(d) {
  if (!d) return 0;
  var m = String(d).match(/(\d+)m(?:(\d+)f)?/i);
  if (m) return parseInt(m[1])*8 + (parseInt(m[2])||0);
  m = String(d).match(/(\d+(?:\.\d+)?)f/i);
  if (m) return parseFloat(m[1]);
  return 0;
}

function distBand(f) {
  if (f <= 6)  return 'Sprint (≤6f)';
  if (f <= 9)  return 'Mile (7–9f)';
  if (f <= 13) return 'Middle (10–13f)';
  return 'Staying (14f+)';
}

function goingBand(g) {
  if (!g) return 'Unknown';
  var gl = g.toLowerCase();
  if (gl.indexOf('firm') > -1 || gl.indexOf('fast') > -1) return 'Firm/Fast';
  if (gl.indexOf('good to firm') > -1 || gl.indexOf('standard to fast') > -1) return 'Gd-Firm';
  if (gl.indexOf('good to soft') > -1 || gl.indexOf('standard to slow') > -1) return 'Gd-Soft';
  if (gl.indexOf('good') > -1 || gl.indexOf('standard') > -1) return 'Good/Std';
  if (gl.indexOf('soft') > -1 || gl.indexOf('slow') > -1) return 'Soft/Slow';
  if (gl.indexOf('heavy') > -1 || gl.indexOf('yielding') > -1) return 'Heavy/Yld';
  return 'Other';
}

function fieldBand(runners) {
  var n = runners || 0;
  if (n <= 5)  return '2–5 runners';
  if (n <= 9)  return '6–9 runners';
  if (n <= 15) return '10–15 runners';
  return '16+ runners';
}

function analyseByDimension(log, keyFn, label) {
  var groups = {};
  log.forEach(function(e) {
    var k = keyFn(e);
    if (!k || k === 'Unknown') return;
    if (!groups[k]) groups[k] = { n:0, wins:0, placed:0, rankSum:0, rankCount:0 };
    groups[k].n++;
    if (e.topPickWon)    groups[k].wins++;
    if (e.topPickPlaced) groups[k].placed++;
    if (e.winnerRank > 0) { groups[k].rankSum += e.winnerRank; groups[k].rankCount++; }
  });

  var results = [];
  var totalWinRate = log.length ? log.filter(function(e){return e.topPickWon;}).length / log.length : 0;

  Object.keys(groups).forEach(function(k) {
    var g = groups[k];
    if (g.n < 5) return; // need at least 5 races to be meaningful
    var winRate   = g.wins / g.n;
    var placeRate = (g.wins + g.placed) / g.n;
    var avgRank   = g.rankCount ? g.rankSum / g.rankCount : 0;
    var vsAvg     = winRate - totalWinRate; // how much better/worse than average
    results.push({ key:k, n:g.n, wins:g.wins, winRate:winRate, placeRate:placeRate, avgRank:avgRank, vsAvg:vsAvg });
  });

  results.sort(function(a,b){ return b.vsAvg - a.vsAvg; });
  return results;
}

function generateRecommendation(dim, result, totalWinRate) {
  var wr   = Math.round(result.winRate * 100);
  var avg  = Math.round(totalWinRate * 100);
  var diff = wr - avg;
  var ar   = result.avgRank ? result.avgRank.toFixed(1) : '—';

  if (diff >= 8) {
    return 'Model performs well here (+' + diff + '% vs average). '
      + 'Consider increasing weight for ' + dim + '-related features when in this category.';
  } else if (diff <= -8) {
    return 'Model underperforms here (' + diff + '% vs average, avg winner rank ' + ar + '). '
      + 'Consider reducing confidence in this category or adding it as a filter in the Lucky 15.';
  } else if (diff <= -5 && result.avgRank > 3) {
    return 'Slightly below average with winner often ranking ' + ar + ' — model is not finding the right horse here. Worth reviewing.';
  }
  return 'Within normal range — no significant adjustment needed.';
}

      fn: function(e){ return distBand(parseDist(e.dist)); },

    },
    {
      label: 'Going',
      fn: function(e){ return goingBand(e.going); },
      advice: 'Going preference (gw) feature in the model'
    },
    {
      label: 'Odds Range',
      fn: function(e){
        var o = e.topPickOdds || 0;
        if (!o) return null;
        if (o < 2.5)  return 'Odds-on (<5/2)';
        if (o < 4.0)  return '5/2–3/1';
        if (o < 6.0)  return '4/1–5/1';
        if (o < 10.0) return '6/1–9/1';
        return '10/1+';
      },
      advice: 'Market agreement filter and confidence threshold'
    },
    {
      label: 'Confidence Band',
      fn: function(e){
        var c = (e.topPickConf || 0);
        if (c < 0.15) return '<15%';
        if (c < 0.20) return '15–20%';
        if (c < 0.25) return '20–25%';
        if (c < 0.30) return '25–30%';
        if (c < 0.40) return '30–40%';

      },
      advice: 'Calibration multipliers — run Calibrate Now in Setup after seeing this'

    results.forEach(function(r) {
      var wr    = Math.round(r.winRate * 100);
      var avg   = Math.round(totalWinRate * 100);
      var diff  = wr - avg;
      var col   = diff >= 6 ? 'var(--green)' : diff <= -6 ? 'var(--red)' : 'var(--mt)';
      var icon  = diff >= 6 ? '▲' : diff <= -6 ? '▼' : '—';
      var barW  = Math.min(Math.round(r.winRate / 0.6 * 100), 100);
      var avgW  = Math.min(Math.round(totalWinRate / 0.6 * 100), 100);
      var rec   = generateRecommendation(dim.label, r, totalWinRate);

      h += '<div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.04)">';
      // Row header

        + esc(r.key) + ' <span style="color:var(--mt);font-size:.58rem">(' + r.n + ' races)</span></span>';
      h += '<span style="font-family:var(--mono);font-size:.7rem;color:' + col + '">'
        + icon + ' ' + wr + '% <span style="font-size:.58rem;color:var(--mt)">vs ' + avg + '% avg</span></span>';
      h += '</div>';
      // Bar
      h += '<div style="position:relative;height:8px;background:rgba(255,255,255,.04);border-radius:4px;margin-bottom:5px">';
      h += '<div style="position:absolute;left:0;top:0;height:100%;width:' + barW + '%;'
        + 'background:' + col + ';opacity:.5;border-radius:4px"></div>';
      // Average line
      h += '<div style="position:absolute;left:' + avgW + '%;top:-2px;width:2px;height:12px;'
        + 'background:rgba(255,255,255,.4);border-radius:1px"></div>';
      h += '</div>';
      // Recommendation
      h += '<div style="font-family:var(--mono);font-size:.6rem;color:var(--mt);line-height:1.5">'
        + rec + '</div>';
      if (diff >= 6 || diff <= -6) {
        h += '<div style="font-family:var(--mono);font-size:.58rem;color:rgba(255,255,255,.3);'
          + 'margin-top:3px">→ Affects: ' + esc(dim.advice) + '</div>';
      }
      h += '</div>';
    });

    h += '</div>';
  });

  // ── Winner rank analysis ──────────────────────────────
  var rankDist = [0,0,0,0,0,0]; // ranks 1-5, and 6+
  var rankTotal = 0;
  log.forEach(function(e) {
    if (e.winnerRank > 0) {
      rankTotal++;

  if (rankTotal > 0) {
    h += '<div style="background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px">';

      + 'Where does the actual winner appear in your predictions?</div>';

    var rankLabels = ['#1 (Top Pick)','#2','#3','#4','#5','#6+/Not found'];
    var rankCols   = ['var(--green)','var(--gold)','#cd7f32','var(--mt)','var(--mt)','var(--red)'];
    rankDist.forEach(function(n, i) {
      var pct = Math.round(n / rankTotal * 100);
      var barW = pct;
      h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">';
      h += '<span style="font-family:var(--mono);font-size:.62rem;color:' + rankCols[i] + ';width:90px;flex-shrink:0">' + rankLabels[i] + '</span>';
      h += '<div style="flex:1;height:14px;background:rgba(255,255,255,.04);border-radius:3px;overflow:hidden">';
      h += '<div style="width:' + barW + '%;height:100%;background:' + rankCols[i] + ';opacity:.6;border-radius:3px"></div>';
      h += '</div>';
      h += '<span style="font-family:var(--mono);font-size:.62rem;color:var(--mt);width:44px;text-align:right">' + pct + '% (' + n + ')</span>';
      h += '</div>';
    });

    // Interpretation
    var top2pct = Math.round((rankDist[0]+rankDist[1]) / rankTotal * 100);
    var missedPct = Math.round(rankDist[5] / rankTotal * 100);
    h += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06);'
      + 'font-family:var(--mono);font-size:.63rem;color:var(--mt);line-height:1.7">';
    if (top2pct >= 50) {
      h += '✓ Winner is in your top 2 picks ' + top2pct + '% of the time — model is ranking well.';
    } else {

    }
    if (missedPct > 30) {
      h += ' ' + missedPct + '% of winners not in your top 5 at all — consider expanding predictions shown.';
    }
    h += '</div>';
    h += '</div>';
  }

  // ── Overall recommendation summary ───────────────────
  h += '<div style="background:rgba(0,230,118,.05);border:1px solid rgba(0,230,118,.2);'
    + 'border-radius:10px;padding:14px;margin-bottom:12px">';
  h += '<div style="font-family:var(--mono);font-size:.62rem;text-transform:uppercase;'
    + 'letter-spacing:2px;color:var(--green);margin-bottom:10px">📋 Retrain Checklist</div>';

  var steps = [
    'Export your results JSON from the Predictor (⬇ Export Results JSON button)',
    'Open the Trainer app and load your racing CSV',
    'Retrain — the model will rebuild with your latest data',
    'If specific going types are underperforming, check you have enough CSV rows for those conditions',
    'Run Calibrate Now in the Predictor Setup tab after loading the new model',
    'Log another 30+ races and re-check this Insights tab'
  ];

  steps.forEach(function(step, i) {
    h += '<div style="display:flex;gap:10px;margin-bottom:8px">';
    h += '<span style="font-family:var(--mono);font-size:.65rem;color:var(--green);flex-shrink:0">' + (i+1) + '.</span>';
    h += '<span style="font-family:var(--mono);font-size:.65rem;color:var(--mt);line-height:1.5">' + step + '</span>';
    h += '</div>';
  });

  h += '</div>';
  h += '</div>'; // padding wrap
