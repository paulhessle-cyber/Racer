<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formintel — Results</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #00e676;
    --gold:  #ffc107;
    --red:   #ff5252;
    --blue:  #448aff;
    --bg:    #07090b;
    --sf:    #0d1410;
    --bd:    #1c2a1e;
    --text:  #c8dece;
    --mt:    #4a6a55;
    --white: #eef6f0;
    --mono:  'IBM Plex Mono', monospace;
  }

- { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

body {
font-family: ‘IBM Plex Sans’, sans-serif;
background: var(–bg);
color: var(–text);
min-height: 100vh;
padding: 0 0 60px;
}

/* ── Header ── */
.hdr {
display: flex;
align-items: center;
justify-content: space-between;
padding: 16px 20px;
border-bottom: 1px solid var(–bd);
position: sticky;
top: 0;
background: var(–bg);
z-index: 10;
}

.hdr h1 {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 1.5rem;
letter-spacing: 1px;
color: var(–green);
}

.hdr-sub {
font-family: var(–mono);
font-size: .6rem;
color: var(–mt);
text-transform: uppercase;
letter-spacing: 2px;
}

/* ── Summary Cards ── */
.summary {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 10px;
padding: 16px;
}

.stat-card {
background: var(–sf);
border: 1px solid var(–bd);
border-radius: 10px;
padding: 14px 12px;
text-align: center;
position: relative;
overflow: hidden;
}

.stat-card::before {
content: ‘’;
position: absolute;
top: 0; left: 0; right: 0;
height: 3px;
border-radius: 10px 10px 0 0;
}

.stat-card.win::before  { background: var(–green); }
.stat-card.place::before { background: var(–gold); }
.stat-card.loss::before  { background: var(–red); }
.stat-card.total::before { background: var(–blue); }
.stat-card.rank::before  { background: var(–mt); }
.stat-card.streak::before { background: #ff6d00; }

.stat-num {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 2.4rem;
line-height: 1;
margin-bottom: 4px;
}

.win  .stat-num  { color: var(–green); }
.place .stat-num { color: var(–gold); }
.loss  .stat-num { color: var(–red); }
.total .stat-num { color: var(–blue); }
.rank  .stat-num { color: var(–mt); }
.streak .stat-num { color: #ff6d00; }

.stat-label {
font-family: var(–mono);
font-size: .58rem;
text-transform: uppercase;
letter-spacing: 1.5px;
color: var(–mt);
line-height: 1.3;
}

/* ── Bar chart ── */
.chart-wrap {
margin: 0 16px 16px;
background: var(–sf);
border: 1px solid var(–bd);
border-radius: 10px;
padding: 16px;
}

.chart-title {
font-family: var(–mono);
font-size: .62rem;
text-transform: uppercase;
letter-spacing: 2px;
color: var(–mt);
margin-bottom: 14px;
}

.bar-row {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 10px;
}

.bar-label {
font-family: var(–mono);
font-size: .65rem;
color: var(–text);
width: 48px;
flex-shrink: 0;
}

.bar-track {
flex: 1;
height: 20px;
background: rgba(255,255,255,.04);
border-radius: 4px;
overflow: hidden;
}

.bar-fill {
height: 100%;
border-radius: 4px;
transition: width .8s cubic-bezier(.16,1,.3,1);
display: flex;
align-items: center;
padding-left: 8px;
font-family: var(–mono);
font-size: .6rem;
font-weight: 600;
white-space: nowrap;
min-width: 2px;
}

.bar-fill.win   { background: linear-gradient(90deg, #00c853, #00e676); color: #000; }
.bar-fill.place { background: linear-gradient(90deg, #ff8f00, #ffc107); color: #000; }
.bar-fill.loss  { background: linear-gradient(90deg, #c62828, #ff5252); color: #fff; }

.bar-pct {
font-family: var(–mono);
font-size: .65rem;
color: var(–text);
width: 36px;
text-align: right;
flex-shrink: 0;
}

/* ── Section header ── */
.section-hdr {
font-family: var(–mono);
font-size: .62rem;
text-transform: uppercase;
letter-spacing: 2px;
color: var(–mt);
padding: 0 16px 10px;
display: flex;
align-items: center;
gap: 8px;
}

.section-hdr::before {
content: ‘’;
display: block;
width: 20px;
height: 1px;
background: var(–green);
}

/* ── Race cards ── */
.races {
padding: 0 16px;
display: flex;
flex-direction: column;
gap: 10px;
}

.race-card {
background: var(–sf);
border: 1px solid var(–bd);
border-radius: 10px;
overflow: hidden;
animation: fadeIn .3s ease both;
}

@keyframes fadeIn {
from { opacity: 0; transform: translateY(8px); }
to   { opacity: 1; transform: none; }
}

.race-card.win   { border-left: 3px solid var(–green); }
.race-card.place { border-left: 3px solid var(–gold); }
.race-card.loss  { border-left: 3px solid #333; }

.race-top {
display: flex;
align-items: center;
justify-content: space-between;
padding: 12px 14px 8px;
}

.race-info {}

.race-name {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 1.1rem;
color: var(–white);
letter-spacing: .5px;
}

.race-meta {
font-family: var(–mono);
font-size: .58rem;
color: var(–mt);
margin-top: 2px;
}

.race-badge {
font-family: var(–mono);
font-size: .6rem;
text-transform: uppercase;
letter-spacing: 1px;
padding: 4px 10px;
border-radius: 20px;
font-weight: 600;
}

.badge-win   { background: rgba(0,230,118,.15); color: var(–green); border: 1px solid rgba(0,230,118,.3); }
.badge-place { background: rgba(255,193,7,.12); color: var(–gold);  border: 1px solid rgba(255,193,7,.3); }
.badge-loss  { background: rgba(255,82,82,.08); color: #666;         border: 1px solid #222; }

.race-body {
padding: 0 14px 12px;
display: flex;
flex-direction: column;
gap: 6px;
}

.race-row {
display: flex;
align-items: baseline;
gap: 8px;
font-size: .78rem;
}

.race-row-label {
font-family: var(–mono);
font-size: .58rem;
color: var(–mt);
text-transform: uppercase;
letter-spacing: 1px;
width: 52px;
flex-shrink: 0;
}

.race-row-val {
color: var(–text);
font-size: .82rem;
}

.rank-1 { color: var(–green); font-weight: 600; }
.rank-2 { color: var(–gold); }
.rank-3 { color: #cd7f32; }
.rank-bad { color: var(–mt); }

/* ── Predictions list ── */
.preds-list {
display: flex;
flex-wrap: wrap;
gap: 4px;
margin-top: 2px;
}

.pred-chip {
font-family: var(–mono);
font-size: .58rem;
padding: 2px 7px;
border-radius: 4px;
background: rgba(255,255,255,.04);
border: 1px solid var(–bd);
color: var(–mt);
}

.pred-chip.is-winner {
background: rgba(0,230,118,.12);
border-color: rgba(0,230,118,.3);
color: var(–green);
}

.pred-chip.is-placed {
background: rgba(255,193,7,.1);
border-color: rgba(255,193,7,.25);
color: var(–gold);
}

/* ── Empty state ── */
.empty {
text-align: center;
padding: 60px 30px;
color: var(–mt);
}

.empty-icon { font-size: 3rem; margin-bottom: 16px; }

.empty-title {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 1.5rem;
color: var(–text);
margin-bottom: 8px;
}

.empty-sub { font-size: .85rem; line-height: 1.6; }

/* ── Filter bar ── */
.filter-bar {
display: flex;
gap: 8px;
padding: 0 16px 14px;
overflow-x: auto;
scrollbar-width: none;
}

.filter-bar::-webkit-scrollbar { display: none; }

.filter-btn {
font-family: var(–mono);
font-size: .6rem;
text-transform: uppercase;
letter-spacing: 1px;
padding: 6px 14px;
border-radius: 20px;
border: 1px solid var(–bd);
background: transparent;
color: var(–mt);
cursor: pointer;
white-space: nowrap;
transition: all .2s;
}

.filter-btn.active {
background: rgba(0,230,118,.12);
border-color: rgba(0,230,118,.4);
color: var(–green);
}

/* ── Clear data button ── */
.clear-btn {
display: block;
margin: 20px 16px 0;
width: calc(100% - 32px);
padding: 12px;
border-radius: 8px;
border: 1px solid var(–bd);
background: transparent;
color: var(–mt);
font-family: var(–mono);
font-size: .65rem;
text-transform: uppercase;
letter-spacing: 2px;
cursor: pointer;
transition: all .2s;
}

.clear-btn:hover {
border-color: var(–red);
color: var(–red);
}
</style>

</head>
<body>

<div class="hdr">
  <div>
    <h1>Formintel Results</h1>
    <div class="hdr-sub" id="subtitle">Loading...</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px"><button onclick="debugStorage()" style="font-family:var(--mono);font-size:.55rem;padding:5px 10px;border-radius:6px;border:1px solid var(--bd);background:transparent;color:var(--mt);cursor:pointer;text-transform:uppercase;letter-spacing:1px">Debug</button><div style="font-size:1.6rem">📊</div></div>
</div>

<div id="app"></div>

<script>
var LOG_KEY = 'rq_pred_log_v1';
var currentFilter = 'all';

function getLog() {
  try {
    // Try the primary key first
    var raw = localStorage.getItem(LOG_KEY);
    if (raw) return JSON.parse(raw);

    // Fallback: scan all localStorage keys for any pred log data
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('rq_pred') > -1) {
        try {
          var d = JSON.parse(localStorage.getItem(k));
          if (Array.isArray(d) && d.length && d[0].raceKey) return d;
        } catch(e) {}
      }
    }
    return [];
  } catch(e) { return []; }
}

function debugStorage() {
  var keys = [];
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      var v = localStorage.getItem(k);
      var preview = v ? v.substring(0, 60) : '(empty)';
      keys.push(k + ': ' + preview);
    }
  } catch(e) {
    keys = ['Error reading localStorage: ' + e.message];
  }
  if (!keys.length) keys = ['localStorage is completely empty'];
  alert('localStorage contents (' + keys.length + ' keys):\n\n' + keys.join('\n\n'));
}

function classify(entry) {
  if (entry.topPickWon)    return 'win';
  if (entry.topPickPlaced) return 'place';
  return 'loss';
}

function pct(n, total) {
  if (!total) return '0%';
  return Math.round(n / total * 100) + '%';
}

function render() {
  var log = getLog();

  // Sort newest first
  log.sort(function(a, b) {
    return (b.date || '').localeCompare(a.date || '') ||
           (b.time || '').localeCompare(a.time || '');
  });

  var total  = log.length;
  var wins   = log.filter(function(e){ return e.topPickWon; }).length;
  var places = log.filter(function(e){ return !e.topPickWon && e.topPickPlaced; }).length;
  var losses = total - wins - places;

  // Best/worst streak
  var curStreak = 0, maxStreak = 0, streakType = '';
  for (var i = 0; i < log.length; i++) {
    var c = classify(log[i]);
    if (i === 0) { curStreak = 1; streakType = c === 'loss' ? 'loss' : 'good'; }
    else {
      var prev = classify(log[i-1]);
      var cur  = classify(log[i]);
      var curGood  = cur  !== 'loss';
      var prevGood = prev !== 'loss';
      if (curGood === prevGood) curStreak++;
      else curStreak = 1;
    }
    if (curStreak > maxStreak) maxStreak = curStreak;
  }

  // Avg winner rank
  var rankedEntries = log.filter(function(e){ return e.winnerRank > 0; });
  var avgRank = rankedEntries.length
    ? (rankedEntries.reduce(function(s,e){ return s + e.winnerRank; }, 0) / rankedEntries.length).toFixed(1)
    : '-';

  // Update subtitle
  document.getElementById('subtitle').textContent =
    total + ' race' + (total !== 1 ? 's' : '') + ' logged';

  // Filter
  var filtered = currentFilter === 'all' ? log
    : log.filter(function(e){ return classify(e) === currentFilter; });

  var app = document.getElementById('app');

  if (total === 0) {
    app.innerHTML = '<div class="empty">' +
      '<div class="empty-icon">🏇</div>' +
      '<div class="empty-title">No Results Yet</div>' +
      '<div class="empty-sub">Log race results in the Predictor app after each race.<br>Your stats will appear here automatically.<br><br><strong style="color:var(--gold)">⚠ Important:</strong> Both the Predictor and this dashboard must be opened from the <strong>same location</strong> (both from GitHub Pages, or both as local files) — they cannot share data across different origins.<br><br>Tap <strong>Debug</strong> in the top right to inspect what's in storage.</div>' +
      '</div>';
    return;
  }

  var html = '';

  // ── Summary stats ──
  html += '<div class="summary">';
  html += statCard('win',    pct(wins,   total), 'Win<br>Rate');
  html += statCard('place',  pct(places, total), 'Place<br>Rate');
  html += statCard('loss',   pct(losses, total), 'Loss<br>Rate');
  html += statCard('total',  total,              'Races<br>Logged');
  html += statCard('rank',   avgRank,            'Avg Winner<br>Rank');
  html += statCard('streak', maxStreak,          'Best<br>Streak');
  html += '</div>';

  // ── Bar chart ──
  html += '<div class="chart-wrap">';
  html += '<div class="chart-title">Result Breakdown</div>';
  html += barRow('Wins',   wins,   total, 'win');
  html += barRow('Places', places, total, 'place');
  html += barRow('Losses', losses, total, 'loss');
  html += '</div>';

  // ── Filter buttons ──
  html += '<div class="section-hdr">Race Log</div>';
  html += '<div class="filter-bar">';
  html += filterBtn('all',   'All (' + total + ')');
  html += filterBtn('win',   '🟢 Wins (' + wins + ')');
  html += filterBtn('place', '🟡 Places (' + places + ')');
  html += filterBtn('loss',  '🔴 Losses (' + losses + ')');
  html += '</div>';

  // ── Race list ──
  html += '<div class="races">';

  if (!filtered.length) {
    html += '<div style="text-align:center;padding:30px;color:var(--mt);font-family:var(--mono);font-size:.75rem">No ' + currentFilter + ' results yet</div>';
  }

  filtered.forEach(function(entry, idx) {
    var cls   = classify(entry);
    var badge = cls === 'win'   ? '<span class="race-badge badge-win">✓ Win</span>'
              : cls === 'place' ? '<span class="race-badge badge-place">◎ Place</span>'
              :                   '<span class="race-badge badge-loss">✗ Loss</span>';

    var rankCol = entry.winnerRank === 1 ? 'rank-1'
                : entry.winnerRank === 2 ? 'rank-2'
                : entry.winnerRank === 3 ? 'rank-3'
                : 'rank-bad';

    var rankText = entry.winnerRank > 0
      ? '<span class="' + rankCol + '">#' + entry.winnerRank + '</span> in predictions'
      : 'Winner not in predictions';

    // Top 3 predictions as chips
    var preds = entry.predictions || [];
    var actual = entry.actual || [];
    var chips = preds.slice(0, 5).map(function(p, i) {
      var isWinner = actual[0] && p.name === actual[0];
      var isPlaced = actual.indexOf(p.name) > -1;
      var chipCls  = isWinner ? ' is-winner' : isPlaced ? ' is-placed' : '';
      var conf     = p.score ? ' ' + Math.round(p.score * 100) + '%' : '';
      return '<span class="pred-chip' + chipCls + '">' + (i+1) + '. ' + p.name + conf + '</span>';
    }).join('');

    var course  = [entry.course, entry.time, entry.dist].filter(Boolean).join(' · ');
    var winner  = actual[0] || '—';
    var topPick = preds[0] ? preds[0].name : '—';

    html += '<div class="race-card ' + cls + '" style="animation-delay:' + (idx * 0.04) + 's">';
    html += '<div class="race-top">';
    html += '<div class="race-info">';
    html += '<div class="race-name">' + escHtml(course) + '</div>';
    html += '<div class="race-meta">' + (entry.date || '') + (entry.going ? ' · ' + entry.going : '') + '</div>';
    html += '</div>';
    html += badge;
    html += '</div>';

    html += '<div class="race-body">';

    html += '<div class="race-row">';
    html += '<span class="race-row-label">Winner</span>';
    html += '<span class="race-row-val">' + escHtml(winner) + '</span>';
    html += '</div>';

    html += '<div class="race-row">';
    html += '<span class="race-row-label">Top Pick</span>';
    html += '<span class="race-row-val">' + escHtml(topPick) + '</span>';
    html += '</div>';

    html += '<div class="race-row">';
    html += '<span class="race-row-label">Rank</span>';
    html += '<span class="race-row-val">' + rankText + '</span>';
    html += '</div>';

    if (chips) {
      html += '<div class="preds-list">' + chips + '</div>';
    }

    html += '</div>';
    html += '</div>';
  });

  html += '</div>';

  if (total > 0) {
    html += '<button class="clear-btn" onclick="clearData()">🗑 Clear All Results</button>';
  }

  app.innerHTML = html;
}

function statCard(cls, num, label) {
  return '<div class="stat-card ' + cls + '">' +
    '<div class="stat-num">' + num + '</div>' +
    '<div class="stat-label">' + label + '</div>' +
    '</div>';
}

function barRow(label, n, total, cls) {
  var p = total ? Math.round(n / total * 100) : 0;
  var display = p > 6 ? p + '%' : '';
  return '<div class="bar-row">' +
    '<span class="bar-label">' + label + '</span>' +
    '<div class="bar-track">' +
      '<div class="bar-fill ' + cls + '" style="width:' + p + '%">' + display + '</div>' +
    '</div>' +
    '<span class="bar-pct">' + p + '%</span>' +
    '</div>';
}

function filterBtn(val, label) {
  var active = currentFilter === val ? ' active' : '';
  return '<button class="filter-btn' + active + '" onclick="setFilter(\'' + val + '\')">' + label + '</button>';
}

function setFilter(val) {
  currentFilter = val;
  render();
}

function clearData() {
  if (confirm('Clear all ' + getLog().length + ' logged results? This cannot be undone.')) {
    localStorage.removeItem(LOG_KEY);
    render();
  }
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Run
render();
</script>

</body>
</html>
