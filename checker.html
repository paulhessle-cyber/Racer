else renderImport();

// ── Auto-load from the proxy export, then merge ──────────────────────────────
// The predictor auto-logs results to this same origin's localStorage, so on the
// SAME device the checker already has everything. This fetch matters when you
// open the checker on a DIFFERENT device (phone vs iPad): it pulls the full
// server-side history and merges any races this device hasn't seen. Merge is
// non-destructive — existing local races are never overwritten or removed.
// Must match the key the PREDICTOR writes (fi_odds_proxy_url). These were
// different keys, so the checker never saw the URL you'd configured and
// silently fell back to the default below.
var OWNER_KEY = 'fi_owner_id';
function getOwnerId() {
  try { return localStorage.getItem(OWNER_KEY) || ''; } catch(e) { return ''; }
}

var PROXY_KEY = 'fi_odds_proxy_url';
function getProxyBase() {
  try {
    var u = localStorage.getItem(PROXY_KEY) || localStorage.getItem('formintel_proxy_url');
    if (u) return u.replace(/\/+$/, '');
  } catch(e){}
  return 'https://odds.formintel.co.uk';  // sensible default
}

// Identify a race by course+date+time rather than raceKey. Older raceKeys were
// just course_time with no date, so at a multi-day meeting yesterday's race and
// today's shared a key — and this merge silently discarded today's as a
// duplicate. course+date+time is unique regardless of key format.
// ── Course name canonicalisation ─────────────────────────────────────────────
// The same track arrives with different spellings depending on source: PDF
// racecards give "BEVERLEY", Betfair gives "Beverley", and some carry an
// "(A.W.)" suffix. Grouping on the raw string split 48 courses into two rows
// each. courseKey() gives one stable key; courseName() gives a tidy label.
function courseKey(c) {
  return String(c || 'Unknown')
    .toUpperCase()
    .replace(/\(\s*A\.?\s*W\.?\s*\)/g,'')   // drop (A.W.) / (AW)
    .replace(/[^A-Z0-9]/g,'')                    // punctuation + spaces
    .trim() || 'UNKNOWN';
}
function courseName(c) {
  var raw = String(c || 'Unknown').replace(/\(\s*A\.?\s*W\.?\s*\)/gi,'').trim();
  // Title-case so "BEVERLEY" and "Beverley" render identically
  return raw.toLowerCase().replace(/\b[a-z]/g, function(m){ return m.toUpperCase(); })
            .replace(/\bAw\b/g,'AW').replace(/\s+/g,' ').trim() || 'Unknown';
}

function raceIdent(e) {
  if (!e) return '';
  if (e.course && e.date && e.time) return e.course + '|' + e.date + '|' + e.time;
  return e.raceKey || '';
}

function mergeServerLog(serverRaces) {
  if (!Array.isArray(serverRaces) || !serverRaces.length) return 0;
  var local = Array.isArray(loadedLog) ? loadedLog.slice() : [];
  var seen = {};
  local.forEach(function(e){ var id = raceIdent(e); if (id) seen[id] = true; });
  var added = 0;
  serverRaces.forEach(function(e){
    var id = raceIdent(e);
    if (!id) return;
    if (seen[id]) return;             // already have it locally — keep local copy
    local.push(e); seen[id] = true; added++;
  });
  if (added) {
    loadedLog = local;
    try { localStorage.setItem(LOG_KEY, JSON.stringify(local)); } catch(e){}
    renderAll();
  }
  return added;
}

// Show what the server sync actually did, on the import screen and as a
// subtitle note. Silent failure is what made this look like "nothing saves":
// a 404, CORS block or empty server all looked identical (blank screen).
function setSyncStatus(msg, kind) {
  var el = document.getElementById('syncStatus');
  if (!el) return;
  var col = kind === 'ok' ? 'var(--green)' : kind === 'warn' ? 'var(--gold)' : 'var(--red)';
  el.innerHTML = '<span style="color:' + col + '">' + msg + '</span>';
}

function loadFromServer(manual) {
  var base = getProxyBase();
  if (!base || typeof fetch !== 'function') { setSyncStatus('No proxy URL configured.', 'err'); return Promise.resolve(0); }
  setSyncStatus('Checking ' + base + ' …', 'warn');
  var who = getOwnerId();
  if (!who) {
    setSyncStatus('No device ID yet — open the Predictor once on this device, then come back.', 'warn');
    return Promise.resolve(0);
  }
  return fetch(base + '/export?owner=' + encodeURIComponent(who))
    .then(function(r){
      if (!r.ok) throw new Error('server returned ' + r.status + (r.status === 404 ? ' (old server.js still running — restart the proxy)' : ''));
      return r.json();
    })
    .then(function(d){
      var races = Array.isArray(d) ? d : (d && (d.log || d.races || d.results)) || [];
      if (!races.length) {
        setSyncStatus('Connected, but the server has no results yet. Open the Predictor and tap ⬇ Export Results JSON to push them up.', 'warn');
        return 0;
      }
      // Set status BEFORE merging: a successful merge calls renderAll(), which
      // replaces the import screen (and the status element with it). The
      // persistent confirmation goes in the subtitle, which survives the render.
      setSyncStatus('✓ Server holds ' + races.length + ' races — loading…', 'ok');
      var added = mergeServerLog(races);
      var note = document.getElementById('subtitle');
      if (note) {
        var base2 = added ? ('Synced from server · +' + added + ' new')
                          : ('Up to date with server · ' + races.length + ' races');
        note.textContent = note.textContent.replace(/ · (Synced|Up to date).*$/, '') + ' · ' + base2;
      }
      setSyncStatus(added ? ('✓ Loaded ' + added + ' new races from server.')
                          : ('✓ Up to date — server holds ' + races.length + ' races, all already here.'), 'ok');
      return added;
    })
    .catch(function(err){
      setSyncStatus('Could not reach the server: ' + err.message
        + '<br>Check ' + base + '/export opens in your browser.', 'err');
      return 0;
    });
}

(function autoLoadFromServer() {
  // slight delay so the import screen has rendered and can show status
  setTimeout(function(){ loadFromServer(false); }, 200);
})();

// Always render bets tab on load — bet data is independent of prediction log
// Small delay to ensure tab-bets div exists in DOM
setTimeout(function(){ renderBets(); }, 50);

// ══ BF NEXT TIME OUT ANALYSIS ═══════════════════════════════════════════════
function renderBFWatch() {
  var el = document.getElementById('tab-bf');
  if (!el) return;
  if (!loadedLog || !loadedLog.length) {
    el.innerHTML = '<div style="padding:20px;font-family:var(--mono);font-size:.75rem;color:var(--mt)">Load a results JSON to see BF analysis.</div>';
    return;
  }

  // Sort log chronologically
  var sorted = loadedLog.slice().sort(function(a,b){
    return (a.date+a.time) < (b.date+b.time) ? -1 : 1;
  });

  // Build lookup: horse name -> array of race appearances (in order)
  // We track every horse that appeared in predictions across all races
  var horseRaces = {}; // name -> [{date, course, cls, won, placed, hadBF, bfDrop, odds}]
  sorted.forEach(function(entry) {
    (entry.predictions || []).forEach(function(p) {
      var n = p.name;
      if (!horseRaces[n]) horseRaces[n] = [];
      horseRaces[n].push({
        date:   entry.date,
        course: entry.course,
        cls:    entry.cls || 0,
        won:    entry.actual && entry.actual[0] === n,
        placed: entry.actual && entry.actual.slice(0,3).indexOf(n) > -1,
        odds:   p.odds || 0
      });
    });
    // Tag any BF horses in this entry
    (entry.bfHorses || []).forEach(function(bf) {
      if (horseRaces[bf.name]) {
        var last = horseRaces[bf.name][horseRaces[bf.name].length - 1];
        if (last && last.date === entry.date) {
          last.hadBF  = true;
          last.bfDrop = bf.bfDrop || false;
        }
      }
    });
  });

  // Find all race appearances AFTER a BF signal
  var nextTimeResults = []; // {name, bfDate, bfCourse, bfCls, nextDate, nextCourse, nextCls, dropped, won, placed, odds}
  Object.keys(horseRaces).forEach(function(name) {
    var races = horseRaces[name];
    for (var i = 0; i < races.length - 1; i++) {
      if (races[i].hadBF) {
        var next = races[i + 1];
        var dropped = races[i].cls > 0 && next.cls > 0 && next.cls > races[i].cls;
        nextTimeResults.push({
          name:      name,
          bfDate:    races[i].date,
          bfCourse:  races[i].course,
          bfCls:     races[i].cls,
          nextDate:  next.date,
          nextCourse:next.course,
          nextCls:   next.cls,
          dropped:   dropped,
          won:       next.won,
          placed:    next.placed,
          odds:      next.odds,
          bfDrop:    races[i].bfDrop
        });
      }
    }
  });

  var h = '<div style="padding:16px">';
  h += '<div style="font-family:var(--mono);font-size:.75rem;color:var(--mt);margin-bottom:16px">Tracks horses that showed the 👀 BF signal, then checks if they won or placed next time — especially if they dropped in class.</div>';

  // ── Current BF signals (every BF-flagged horse in the log, shown immediately) ──
  var allBFSignals = [];
  sorted.forEach(function(entry) {
    (entry.bfHorses || []).forEach(function(bf) {
      allBFSignals.push({
        name:    bf.name,
        date:    entry.date,
        course:  entry.course,
        cls:     bf.cls || entry.cls || 0,
        odds:    bf.odds || 0,
        bfDrop:  bf.bfDrop || false,
        won:     bf.won || (entry.actual && entry.actual[0] === bf.name),
        placed:  bf.placed || (entry.actual && entry.actual.slice(0,3).indexOf(bf.name) > -1)
      });
    });
  });

  if (allBFSignals.length > 0) {
    var sigWins   = allBFSignals.filter(function(s){ return s.won; }).length;
    var sigPlaced = allBFSignals.filter(function(s){ return !s.won && s.placed; }).length;
    var sigDrops  = allBFSignals.filter(function(s){ return s.bfDrop; }).length;

    h += '<div style="background:var(--card);border:1px solid rgba(255,140,0,.3);border-radius:10px;padding:14px;margin-bottom:16px">';
    h += '<div style="font-family:var(--mono);font-size:.6rem;color:var(--gold);letter-spacing:1px;margin-bottom:10px">👀 BF SIGNALS LOGGED — ' + allBFSignals.length + ' total (' + sigDrops + ' with class drop)</div>';
    h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">';
    h += '<div><div style="font-size:1.4rem;font-weight:700;color:var(--g)">' + sigWins + '</div><div style="font-family:var(--mono);font-size:.6rem;color:var(--mt)">won same day</div></div>';
    h += '<div><div style="font-size:1.4rem;font-weight:700;color:var(--gold)">' + sigPlaced + '</div><div style="font-family:var(--mono);font-size:.6rem;color:var(--mt)">placed</div></div>';
    h += '<div><div style="font-size:1.4rem;font-weight:700;color:var(--mt)">' + (allBFSignals.length>0?Math.round(sigWins/allBFSignals.length*100):0) + '%</div><div style="font-family:var(--mono);font-size:.6rem;color:var(--mt)">win rate</div></div>';
    h += '</div>';

    // Recent BF signals list (last 15)
    h += '<div style="font-family:var(--mono);font-size:.6rem;color:var(--mt);letter-spacing:1px;margin:10px 0 6px">RECENT BF-FLAGGED HORSES</div>';
    var recent = allBFSignals.slice(-15).reverse();
    recent.forEach(function(s) {
      var resCol = s.won ? 'var(--g)' : s.placed ? 'var(--gold)' : 'var(--mt)';
      var resTxt = s.won ? 'WON' : s.placed ? 'PLC' : '—';
      h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd);font-family:var(--mono);font-size:.66rem">';
      h += '<div><span style="color:var(--tx)">' + (s.name||'?') + '</span>' + (s.bfDrop?' <span style="color:var(--gold)">⬇</span>':'') + '</div>';
      h += '<div style="color:var(--mt);font-size:.58rem">' + (s.course||'') + ' ' + (s.date||'') + '</div>';
      h += '<div style="color:' + resCol + ';font-weight:700;min-width:34px;text-align:right">' + resTxt + '</div>';
      h += '</div>';
    });
    h += '</div>';
  }

  if (nextTimeResults.length === 0) {
    h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:20px;text-align:center;font-family:var(--mono);font-size:.75rem;color:var(--mt)">';
    h += '<div style="font-size:2rem;margin-bottom:10px">👀</div>';
    h += 'No BF next-time-out data yet.<br><br>';
    h += 'This populates automatically as you log more races with the updated predictor. A horse needs to appear in your log <strong>twice</strong> — once with a BF signal, once next time out.';
    h += '</div>';
  } else {
    // Summary stats
    var total     = nextTimeResults.length;
    var wins      = nextTimeResults.filter(function(r){ return r.won; }).length;
    var places    = nextTimeResults.filter(function(r){ return !r.won && r.placed; }).length;
    var dropWins  = nextTimeResults.filter(function(r){ return r.dropped && r.won; }).length;
    var dropTotal = nextTimeResults.filter(function(r){ return r.dropped; }).length;
    var sameWins  = nextTimeResults.filter(function(r){ return !r.dropped && r.won; }).length;
    var sameTotal = nextTimeResults.filter(function(r){ return !r.dropped; }).length;

    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">';

    // All BF horses next time
    h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px">';
    h += '<div style="font-family:var(--mono);font-size:.6rem;color:var(--mt);letter-spacing:1px;margin-bottom:8px">ALL BF → NEXT TIME</div>';
    h += '<div style="font-size:1.6rem;font-weight:700;color:var(--g)">' + wins + '/' + total + '</div>';
    h += '<div style="font-family:var(--mono);font-size:.65rem;color:var(--mt);margin-top:2px">won (' + Math.round(wins/total*100) + '% SR)</div>';
    h += '<div style="font-family:var(--mono);font-size:.65rem;color:var(--gold);margin-top:2px">+' + places + ' placed</div>';
    h += '</div>';

    // BF + class drop
    h += '<div style="background:var(--card);border:1px solid rgba(255,140,0,.3);border-radius:10px;padding:14px">';
    h += '<div style="font-family:var(--mono);font-size:.6rem;color:var(--gold);letter-spacing:1px;margin-bottom:8px">👀⬇ BF + CLASS DROP</div>';
    if (dropTotal > 0) {
      h += '<div style="font-size:1.6rem;font-weight:700;color:var(--gold)">' + dropWins + '/' + dropTotal + '</div>';
      h += '<div style="font-family:var(--mono);font-size:.65rem;color:var(--mt);margin-top:2px">won (' + Math.round(dropWins/dropTotal*100) + '% SR)</div>';
      h += '<div style="font-family:var(--mono);font-size:.65rem;color:var(--mt);margin-top:2px">vs ' + Math.round(sameWins/Math.max(sameTotal,1)*100) + '% same/higher class</div>';
    } else {
      h += '<div style="font-family:var(--mono);font-size:.7rem;color:var(--mt)">No class drops logged yet</div>';
    }
    h += '</div>';
    h += '</div>';

    // Individual results table
    h += '<div style="font-family:var(--mono);font-size:.65rem;color:var(--mt);letter-spacing:1px;margin-bottom:8px">INDIVIDUAL RESULTS</div>';

    // Sort: class drops first, then by date
    nextTimeResults.sort(function(a,b){
      if (a.dropped !== b.dropped) return a.dropped ? -1 : 1;
      return a.bfDate < b.bfDate ? -1 : 1;
    });

    nextTimeResults.forEach(function(r) {
      var resultCol   = r.won ? 'var(--g)' : r.placed ? 'var(--gold)' : 'var(--re)';
      var resultLabel = r.won ? '✓ WON' : r.placed ? '▲ PLACED' : '✗ UNPLACED';
      var borderCol   = r.dropped ? 'rgba(255,140,0,.4)' : 'var(--bd)';

      h += '<div style="background:var(--card);border:1px solid ' + borderCol + ';border-radius:8px;padding:12px;margin-bottom:8px">';
      h += '<div style="display:flex;justify-content:space-between;align-items:flex-start">';
      h += '<div>';
      h += '<span style="font-weight:700;font-size:.82rem">' + esc(r.name) + '</span>';
      if (r.dropped) h += ' <span style="font-family:var(--mono);font-size:.62rem;background:rgba(255,140,0,.15);color:#ffaa00;border:1px solid rgba(255,140,0,.4);padding:1px 5px;border-radius:4px">👀⬇ BF DROP</span>';
      h += '</div>';
      h += '<span style="font-family:var(--mono);font-size:.7rem;color:' + resultCol + ';font-weight:700">' + resultLabel + '</span>';
      h += '</div>';

      h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px;font-family:var(--mono);font-size:.62rem;color:var(--mt)">';
      h += '<div>BF run: ' + r.bfDate + (r.bfCls ? ' · Cls ' + r.bfCls : '') + '<br>' + esc(r.bfCourse) + '</div>';
      h += '<div>Next: ' + r.nextDate + (r.nextCls ? ' · Cls ' + r.nextCls : '') + '<br>' + esc(r.nextCourse);
      if (r.dropped) h += ' <span style="color:#ffaa00">⬇ dropped</span>';
      h += '</div>';
      h += '</div>';

      if (r.odds) {
        h += '<div style="font-family:var(--mono);font-size:.6rem;color:var(--mt);margin-top:4px">Ran at ' + r.odds.toFixed(1) + ' next time</div>';
      }
      h += '</div>';
    });
  }

  h += '</div>';
  el.innerHTML = h;
}

// ══ VALUE PICK ANALYSIS ══════════════════════════════════════════════════════
function renderValueTab() {
  var el = document.getElementById('tab-value');
  if (!el) return;
  if (!loadedLog || !loadedLog.length) {
    el.innerHTML = '<div style="padding:20px;font-family:var(--mono);font-size:.75rem;color:var(--mt)">Load a results JSON to see value pick analysis.</div>';
    return;
  }

  var sorted = loadedLog.slice().sort(function(a,b){
    return (a.date+a.time) < (b.date+b.time) ? -1 : 1;
  });

  // Split into races with valuePick logged vs without
  var vpRaces  = sorted.filter(function(e){ return e.valuePick; });
  var allRaces = sorted;

  var h = '<div style="padding:16px">';

  // ── No data yet banner ───────────────────────────────────────────────────
  if (!vpRaces.length) {
    h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:20px;text-align:center">';
    h += '<div style="font-size:2rem;margin-bottom:10px">💰</div>';
    h += '<div style="font-family:var(--mono);font-size:.75rem;color:var(--text);margin-bottom:8px">No value pick data yet</div>';
    h += '<div style="font-family:var(--mono);font-size:.65rem;color:var(--mt);line-height:1.6">';
    h += 'The 💰 VALUE badge was added in v4.0 (10 Jun 2026).<br>';
    h += 'Value picks are tracked automatically as you log races.<br><br>';
    h += 'Upload a results JSON from races logged after that date to see analysis here.';
    h += '</div></div>';
    h += '</div>';
    el.innerHTML = h;
    return;
  }

  // ── Stats ────────────────────────────────────────────────────────────────
  var vpWins    = vpRaces.filter(function(e){ return e.valuePickWon; });
  var vpPlaced  = vpRaces.filter(function(e){ return e.valuePickPlaced; });
  var vpRet     = vpWins.reduce(function(s,e){ return s + (e.valuePickOdds||0); }, 0);
  var vpPnl     = vpRet - vpRaces.length;
  var vpRoi     = vpPnl / vpRaces.length * 100;
  // Each-way ROI (assume 1/4 odds, 3 places for fields 8+)
  var vpEwWins  = vpWins.length; var vpEwPlaces = vpPlaced.length;
  var vpEwRet   = vpWins.reduce(function(s,e){
    return s + (e.valuePickOdds||0) + ((e.valuePickOdds-1)*0.25 + 1); // win part + place part
  }, 0) + vpPlaced.reduce(function(s,e){
    return s + ((e.valuePickOdds-1)*0.25 + 1); // place part only
  }, 0);
  var vpEwPnl   = vpEwRet - vpRaces.length * 2; // 2 stakes per race (win + place)
  var vpEwRoi   = vpEwPnl / (vpRaces.length * 2) * 100;

  // Top pick stats over same period for comparison
  var r1Wins    = vpRaces.filter(function(e){ return e.topPickWon; });
  var r1Ret     = r1Wins.reduce(function(s,e){ return s + (e.topPickOdds||0); }, 0);
  var r1Pnl     = r1Ret - vpRaces.length;
  var r1Roi     = r1Pnl / vpRaces.length * 100;

  // Fav stats over same period
  var favWins   = vpRaces.filter(function(e){ return e.favWon; });
  var favRet    = favWins.reduce(function(s,e){ return s + (e.favOdds||0); }, 0);
  var favPnl    = favRet - vpRaces.length;
  var favRoi    = favPnl / vpRaces.length * 100;

  // How often does valuePick differ from rank 1?
  var diffPick  = vpRaces.filter(function(e){
    return e.valuePick && e.predictions && e.predictions[0] &&
           e.valuePick !== e.predictions[0].name;
  });

  // Header
  h += '<div style="font-family:var(--mono);font-size:.65rem;color:var(--mt);margin-bottom:14px">';
  h += 'Tracking the 💰 VALUE badge — within the model\u2019s top 3, the runner with the biggest model-vs-market edge. ';
  h += vpRaces.length + ' races · ' + vpWins.length + ' wins · ' + vpPlaced.length + ' places (placed without winning).';
  h += '</div>';

  // ── Three-way comparison ─────────────────────────────────────────────────
  h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px">';

  function statCard(label, wins, total, pnl, roi, highlight) {
    var col = roi >= 0 ? 'var(--g)' : roi > -15 ? '#ffaa00' : 'var(--re)';
    var border = highlight ? 'border:1px solid var(--g)' : 'border:1px solid var(--bd)';
    return '<div style="background:var(--card);' + border + ';border-radius:10px;padding:12px;text-align:center">'
      + '<div style="font-family:var(--mono);font-size:.55rem;color:var(--mt);letter-spacing:1px;margin-bottom:6px">' + label + '</div>'
      + '<div style="font-size:1.3rem;font-weight:700;color:' + col + '">' + (roi >= 0 ? '+' : '') + Math.round(roi) + '%</div>'
      + '<div style="font-family:var(--mono);font-size:.6rem;color:var(--mt);margin-top:2px">ROI</div>'
      + '<div style="font-family:var(--mono);font-size:.65rem;color:var(--text);margin-top:4px">'
        + wins + '/' + total + ' (' + Math.round(wins/total*100) + '% SR)'
      + '</div>'
      + '<div style="font-family:var(--mono);font-size:.6rem;color:' + col + ';margin-top:2px">P&L £' + (pnl >= 0 ? '+' : '') + pnl.toFixed(1) + '</div>'
      + '</div>';
  }

  var vpBetter = vpRoi > r1Roi;
  h += statCard('💰 VALUE PICK', vpWins.length, vpRaces.length, vpPnl, vpRoi, vpBetter);
  h += statCard('🏆 RANK 1', r1Wins.length, vpRaces.length, r1Pnl, r1Roi, !vpBetter && r1Roi > favRoi);
  h += statCard('📊 FAVOURITE', favWins.length, vpRaces.length, favPnl, favRoi, false);
  h += '</div>';
  // Each-way addendum
  h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-family:var(--mono);font-size:.68rem">';
  h += '<span style="color:var(--mt)">💰 Value pick each-way (1/4 odds, 3 places): </span>';
  h += '<strong style="color:' + (vpEwRoi>=0?'var(--g)':'var(--re)') + '">' + (vpEwRoi>=0?'+':'') + Math.round(vpEwRoi) + '% ROI</strong>';
  h += '<span style="color:var(--mt)"> · ' + (vpEwWins+vpEwPlaces) + ' returns from ' + vpRaces.length + ' bets';
  h += ' (' + vpEwWins + ' wins + ' + vpEwPlaces + ' places only)</span>';
  h += '</div>';

  // ── Verdict ──────────────────────────────────────────────────────────────
  h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:14px;font-family:var(--mono);font-size:.7rem">';
  h += '<div style="color:var(--mt);font-size:.6rem;letter-spacing:1px;margin-bottom:6px">VERDICT</div>';
  if (vpRaces.length < 30) {
    h += '<span style="color:#ffaa00">⚠ Sample too small (' + vpRaces.length + ' races) — need 50+ for reliable conclusions. Keep logging.</span>';
  } else if (vpRoi > r1Roi && vpRoi > 0) {
    h += '<span style="color:var(--g)">✓ Value picking is outperforming both rank 1 and the favourite. The edge appears real at this sample size — consider using it as your primary pick.</span>';
  } else if (vpRoi > r1Roi && vpRoi <= 0) {
    h += '<span style="color:#ffaa00">Value picking loses less than rank 1 but is still negative ROI. The theory is working directionally but hasn\u2019t flipped positive yet.</span>';
  } else if (vpRoi <= r1Roi) {
    h += '<span style="color:var(--re)">✗ Value picking is NOT outperforming rank 1 at this sample. The rank 1 strategy is better here — or both are losing and the market is just better than the model.</span>';
  }
  h += '</div>';

  // ── When value pick differs from rank 1 ─────────────────────────────────
  if (diffPick.length) {
    var dpWins = diffPick.filter(function(e){ return e.valuePickWon; });
    var dpRet  = dpWins.reduce(function(s,e){ return s + (e.valuePickOdds||0); }, 0);
    var dpPnl  = dpRet - diffPick.length;
    var dpRoi  = dpPnl / diffPick.length * 100;

    h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:14px">';
    h += '<div style="font-family:var(--mono);font-size:.6rem;color:var(--mt);letter-spacing:1px;margin-bottom:8px">WHEN VALUE ≠ RANK 1 (' + diffPick.length + ' races)</div>';
    h += '<div style="font-family:var(--mono);font-size:.7rem;color:var(--text)">';
    h += dpWins.length + '/' + diffPick.length + ' wins (' + Math.round(dpWins.length/diffPick.length*100) + '% SR)';
    h += ' · P&L £' + (dpPnl >= 0 ? '+' : '') + dpPnl.toFixed(1);
    h += ' · ROI ' + (dpRoi >= 0 ? '+' : '') + Math.round(dpRoi) + '%';
    h += '</div>';
    h += '<div style="font-family:var(--mono);font-size:.6rem;color:var(--mt);margin-top:4px">This is the purest test — races where the value pick made a different call to the model\u2019s top pick.</div>';
    h += '</div>';
  }

  // ── Rolling 20-race trend ────────────────────────────────────────────────
  if (vpRaces.length >= 20) {
    h += '<div style="font-family:var(--mono);font-size:.6rem;color:var(--mt);letter-spacing:1px;margin-bottom:6px">ROLLING 20-RACE P&L</div>';
    h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:14px">';
    var roll = [];
    for (var ri = 19; ri < vpRaces.length; ri++) {
      var window = vpRaces.slice(ri-19, ri+1);
      var wWins = window.filter(function(e){ return e.valuePickWon; });
      var wRet  = wWins.reduce(function(s,e){ return s + (e.valuePickOdds||0); }, 0);
      roll.push({ date: vpRaces[ri].date, pnl: wRet - 20 });
    }
    var minPnl = Math.min.apply(null, roll.map(function(r){return r.pnl;}));
    var maxPnl = Math.max.apply(null, roll.map(function(r){return r.pnl;}));
    var range  = maxPnl - minPnl || 1;
    var w = 100 / roll.length;
    h += '<svg viewBox="0 0 100 40" style="width:100%;height:60px">';
    // Zero line
    var zeroY = 38 - ((0 - minPnl) / range) * 36;
    h += '<line x1="0" y1="' + zeroY + '" x2="100" y2="' + zeroY + '" stroke="var(--bd)" stroke-width="0.3"/>';
    // P&L line
    var pts = roll.map(function(r, i) {
      var x = i * w + w/2;
      var y = 38 - ((r.pnl - minPnl) / range) * 36;
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    h += '<polyline points="' + pts + '" fill="none" stroke="var(--g)" stroke-width="0.8"/>';
    h += '</svg>';
    h += '</div>';
  }

  // ── Recent race log ──────────────────────────────────────────────────────
  h += '<div style="font-family:var(--mono);font-size:.6rem;color:var(--mt);letter-spacing:1px;margin-bottom:6px">RECENT RACES</div>';
  var recent = vpRaces.slice(-20).reverse();
  recent.forEach(function(e) {
    var vpName  = e.valuePick || '';
    var vpOdds  = e.valuePickOdds || 0;
    var vpWon   = e.valuePickWon;
    var r1Name  = e.predictions && e.predictions[0] ? e.predictions[0].name : '';
    var diff    = vpName !== r1Name;
    var vpPlc   = e.valuePickPlaced;
    var col     = vpWon ? 'var(--g)' : vpPlc ? '#ffaa00' : 'var(--re)';
    var lbl     = vpWon ? '✓ W' : vpPlc ? '▲ P' : '✗';

    h += '<div style="background:var(--card);border:1px solid ' + (diff ? 'rgba(255,215,0,.3)' : 'var(--bd)') + ';border-radius:6px;padding:8px 10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center">';
    h += '<div>';
    h += '<div style="font-size:.75rem;font-weight:700">' + esc(vpName) + ' <span style="font-weight:400;color:var(--mt)">@ ' + (vpOdds||'?') + '</span>';
    if (diff) h += ' <span style="font-family:var(--mono);font-size:.55rem;color:#ffd700">≠ rank1</span>';
    h += '</div>';
    h += '<div style="font-family:var(--mono);font-size:.6rem;color:var(--mt);margin-top:2px">' + e.date + ' · ' + esc(e.course) + ' · ' + esc(e.dist) + '</div>';
    h += '</div>';
    h += '<span style="font-family:var(--mono);font-size:.8rem;font-weight:700;color:' + col + '">' + lbl + '</span>';
    h += '</div>';
  });

  h += '</div>';
  el.innerHTML = h;
}



// ══ PLACEPOT ANALYSIS ════════════════════════════════════════════════════════
function renderPlacepotTab() {
  var el = document.getElementById('tab-placepot');
  if (!el) return;
  if (!loadedLog || !loadedLog.length) {
    el.innerHTML = '<div style="padding:20px;font-family:var(--mono);font-size:.75rem;color:var(--mt)">Load a results JSON to see placepot analysis.</div>';
    return;
  }

  // ── Aggregate place-rate by course (summary at top) ──────────────────────
  var courses = {};
  loadedLog.forEach(function(e) {
    var c = courseKey(e.course);
    if (!courses[c]) courses[c] = { races:0, placed:0, won:0, label: courseName(e.course) };
    courses[c].races++;
    if (e.topPickWon || e.topPickPlaced) courses[c].placed++;
    if (e.topPickWon) courses[c].won++;
  });
  var courseList = Object.keys(courses).map(function(c){
    var d = courses[c];
    return { name:d.label || courseName(c), races:d.races, placed:d.placed, won:d.won, placeRate:d.placed/d.races };
  }).sort(function(a,b){ return b.placeRate - a.placeRate; });

  var h = '<div style="padding:16px">';

  // ── Day-by-day meeting results (the main event) ──────────────────────────
  var meetings = {};
  loadedLog.forEach(function(e) {
    var key = courseKey(e.course) + '||' + (e.date||'?');
    if (!meetings[key]) meetings[key] = { course:courseName(e.course), date:e.date, races:[] };
    meetings[key].races.push(e);
  });

  var meetingList = Object.keys(meetings).map(function(k){ return meetings[k]; });
  // Sort each meeting's races by time, then sort meetings by date desc
  meetingList.forEach(function(m){
    m.races.sort(function(a,b){ return (a.time||'') < (b.time||'') ? -1 : 1; });
  });
  meetingList.sort(function(a,b){ return (a.date+a.course) < (b.date+b.course) ? 1 : -1; });

  h += '<div style="font-family:var(--mono);font-size:.6rem;color:#00e676;letter-spacing:1px;margin-bottom:8px">\ud83d\udcc5 DAY-BY-DAY RESULTS</div>';
  h += '<div style="font-family:var(--mono);font-size:.6rem;color:var(--mt);margin-bottom:12px">Each meeting shows the top pick result per race. A placepot needs your pick to PLACE in 6 races.</div>';

  meetingList.forEach(function(m) {
    var n = m.races.length;
    var ppRaces = n >= 6 ? m.races.slice(0, 6) : m.races;
    var ppPlaced = ppRaces.filter(function(e){ return e.topPickWon || e.topPickPlaced; }).length;
    var landed = (ppPlaced === ppRaces.length) && ppRaces.length >= 6;
    var totalPlaced = m.races.filter(function(e){ return e.topPickWon || e.topPickPlaced; }).length;

    var statusCol, statusTxt;
    if (n < 6) {
      statusCol = 'var(--mt)';
      statusTxt = 'Only ' + n + ' race' + (n===1?'':'s') + ' logged \u2014 need 6 for a placepot';
    } else if (landed) {
      statusCol = '#00e676';
      statusTxt = '\u2713 PLACEPOT LANDS (all 6 placed)';
    } else {
      statusCol = '#ff5252';
      statusTxt = '\u2717 Busted \u2014 ' + ppPlaced + '/6 placed';
    }

    var border = landed ? 'border:1px solid #00e676' : 'border:1px solid var(--bd)';
    h += '<div style="background:var(--card);' + border + ';border-radius:8px;padding:12px;margin-bottom:8px">';
    h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">';
    h += '<div>';
    h += '<div style="font-weight:700;font-size:.85rem">' + esc(m.course) + '</div>';
    h += '<div style="font-family:var(--mono);font-size:.6rem;color:var(--mt)">' + m.date + ' \u00b7 ' + totalPlaced + '/' + n + ' placed</div>';
    h += '</div>';
    h += '<div style="font-family:var(--mono);font-size:.62rem;color:' + statusCol + ';font-weight:700;text-align:right;max-width:140px">' + statusTxt + '</div>';
    h += '</div>';

    // Per-race result row
    h += '<div style="display:flex;flex-wrap:wrap;gap:4px">';
    m.races.forEach(function(e, ri) {
      var res = e.topPickWon ? 'W' : e.topPickPlaced ? 'P' : 'L';
      var rc  = res === 'W' ? '#00e676' : res === 'P' ? '#ffc107' : '#ff5252';
      var inPP = ri < 6;
      var pick = (e.predictions && e.predictions[0]) ? e.predictions[0].name : '';
      var opacity = inPP ? '1' : '0.4';
      h += '<div style="display:flex;flex-direction:column;align-items:center;opacity:' + opacity + '" title="' + e.time + ' ' + esc(pick) + (inPP?'':' (race 7+, not in placepot)') + '">';
      h += '<div style="width:26px;height:26px;border-radius:5px;background:' + rc + ';color:#000;font-family:var(--mono);font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center">' + res + '</div>';
      h += '<div style="font-family:var(--mono);font-size:.5rem;color:var(--mt);margin-top:2px">' + (e.time||'') + '</div>';
      h += '</div>';
    });
    h += '</div>';
    h += '</div>';
  });

  // ── Aggregate summary by course (collapsed at bottom) ────────────────────
  h += '<div style="font-family:var(--mono);font-size:.6rem;color:#00e676;letter-spacing:1px;margin:20px 0 8px">\ud83d\udcca PLACE RATE BY COURSE (all-time)</div>';
  h += '<div style="font-family:var(--mono);font-size:.58rem;color:var(--mt);margin-bottom:10px">Average across every logged race at each course \u2014 use to spot which tracks the model reads well.</div>';
  courseList.forEach(function(c) {
    var pr = Math.round(c.placeRate*100);
    var col = c.placeRate>=0.70?'#00e676':c.placeRate>=0.55?'#ffaa00':'#ff5252';
    var enough = c.races >= 6;
    h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--card);border:1px solid var(--bd);border-radius:6px;margin-bottom:5px;opacity:' + (enough?'1':'0.55') + '">';
    h += '<span style="font-size:.72rem;font-weight:600">' + esc(c.name) + '</span>';
    h += '<span style="font-family:var(--mono);font-size:.62rem;color:var(--mt)">' + c.placed + '/' + c.races + ' \u00b7 <strong style="color:' + col + '">' + pr + '%</strong></span>';
    h += '</div>';
  });

  h += '</div>';
  el.innerHTML = h;
}




// ══ DUTCHING TAB ══════════════════════════════════════════════════════════════
// Shows £10 win-dutch performance per race, filterable by course, with a
// daily "most profitable course" breakdown.
var _dutchCourseFilter = 'ALL';

function renderDutchTab() {
  var el = document.getElementById('tab-dutch');
  if (!el) return;
  if (!loadedLog || !loadedLog.length) {
    el.innerHTML = '<div style="padding:20px;font-family:var(--mono);font-size:.75rem;color:var(--mt)">Load a results JSON to see dutching analysis.</div>';
    return;
  }

  // Gather all races that have dutch data logged
  var dutchRaces = loadedLog.filter(function(e){ return e.dutch && e.dutch.selections && e.dutch.selections.length; });

  if (!dutchRaces.length) {
    el.innerHTML = '<div style="padding:16px"><div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:20px;text-align:center;font-family:var(--mono);font-size:.75rem;color:var(--mt)">'
      + '<div style="font-size:2rem;margin-bottom:10px">💷</div>'
      + 'No dutching data yet.<br><br>This populates as you log races with the updated predictor. Each race logs the £10 win-dutch result for the top 1/2/3 model selections (by field size).'
      + '</div></div>';
    return;
  }

  // Build per-course aggregates
  var byCourse = {}; // course -> {races, staked, returned, profit, wins}
  dutchRaces.forEach(function(e){
    var c = courseKey(e.course);
    if (!byCourse[c]) byCourse[c] = { races:0, staked:0, returned:0, profit:0, wins:0, label: courseName(e.course) };
    byCourse[c].races++;
    byCourse[c].staked   += e.dutch.outlay || 10;
    byCourse[c].returned += e.dutch.returned || 0;
    byCourse[c].profit   += e.dutch.profit || 0;
    if (e.dutch.won) byCourse[c].wins++;
  });

  var courses = Object.keys(byCourse).sort();

  // Overall totals
  var totRaces = dutchRaces.length;
  var totStaked = dutchRaces.reduce(function(s,e){ return s + (e.dutch.outlay||10); }, 0);
  var totProfit = dutchRaces.reduce(function(s,e){ return s + (e.dutch.profit||0); }, 0);
  var totWins = dutchRaces.filter(function(e){ return e.dutch.won; }).length;
  var roi = totStaked > 0 ? (totProfit/totStaked*100) : 0;

  var h = '<div style="padding:16px">';

  // ── Headline stats ──
  h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">';
  h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px">';
  h += '<div style="font-family:var(--mono);font-size:.58rem;color:var(--mt);letter-spacing:1px;margin-bottom:6px">TOTAL P/L</div>';
  h += '<div style="font-size:1.5rem;font-weight:700;color:' + (totProfit>=0?'var(--g)':'var(--re)') + '">' + (totProfit>=0?'+':'') + '£' + totProfit.toFixed(2) + '</div>';
  h += '<div style="font-family:var(--mono);font-size:.62rem;color:var(--mt);margin-top:2px">' + totRaces + ' races</div>';
  h += '</div>';
  h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px">';
  h += '<div style="font-family:var(--mono);font-size:.58rem;color:var(--mt);letter-spacing:1px;margin-bottom:6px">ROI</div>';
  h += '<div style="font-size:1.5rem;font-weight:700;color:' + (roi>=0?'var(--g)':'var(--re)') + '">' + (roi>=0?'+':'') + roi.toFixed(1) + '%</div>';
  h += '<div style="font-family:var(--mono);font-size:.62rem;color:var(--mt);margin-top:2px">£' + totStaked.toFixed(0) + ' staked</div>';
  h += '</div>';
  h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px">';
  h += '<div style="font-family:var(--mono);font-size:.58rem;color:var(--mt);letter-spacing:1px;margin-bottom:6px">STRIKE RATE</div>';
  h += '<div style="font-size:1.5rem;font-weight:700;color:var(--tx)">' + Math.round(totWins/totRaces*100) + '%</div>';
  h += '<div style="font-family:var(--mono);font-size:.62rem;color:var(--mt);margin-top:2px">' + totWins + '/' + totRaces + ' hit</div>';
  h += '</div>';
  h += '</div>';

  // ── Most profitable course per day ──
  var byDay = {}; // date -> {course -> profit}
  dutchRaces.forEach(function(e){
    var d = e.date || '?';
    if (!byDay[d]) byDay[d] = {};
    var c = courseName(e.course);
    byDay[d][c] = (byDay[d][c] || 0) + (e.dutch.profit || 0);
  });
  var days = Object.keys(byDay).sort().reverse();

  h += '<div style="font-family:var(--mono);font-size:.7rem;color:var(--gold);letter-spacing:1px;margin:18px 0 10px">📅 MOST PROFITABLE COURSE EACH DAY</div>';
  days.slice(0, 14).forEach(function(d){
    var dayCourses = byDay[d];
    var best = null, bestP = -Infinity;
    Object.keys(dayCourses).forEach(function(c){
      if (dayCourses[c] > bestP) { bestP = dayCourses[c]; best = c; }
    });
    var dayTotal = Object.keys(dayCourses).reduce(function(s,c){ return s + dayCourses[c]; }, 0);
    h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)">';
    h += '<div style="font-family:var(--mono);font-size:.66rem;color:var(--mt);min-width:78px">' + d + '</div>';
    h += '<div style="flex:1;font-size:.74rem;color:var(--tx);padding:0 10px">🏆 ' + best + ' <span style="color:' + (bestP>=0?'var(--g)':'var(--re)') + '">' + (bestP>=0?'+':'') + '£' + bestP.toFixed(2) + '</span></div>';
    h += '<div style="font-family:var(--mono);font-size:.66rem;color:' + (dayTotal>=0?'var(--g)':'var(--re)') + ';min-width:60px;text-align:right">' + (dayTotal>=0?'+':'') + '£' + dayTotal.toFixed(2) + '</div>';
    h += '</div>';
  });

  // ── Per-course breakdown (sortable by profit) ──
  h += '<div style="font-family:var(--mono);font-size:.7rem;color:var(--gold);letter-spacing:1px;margin:18px 0 10px">🏇 PROFIT BY COURSE</div>';
  var courseStats = courses.map(function(c){ return { course:(byCourse[c].label || courseName(c)), s:byCourse[c] }; });
  courseStats.sort(function(a,b){ return b.s.profit - a.s.profit; });
  courseStats.forEach(function(cs){
    var s = cs.s;
    var cRoi = s.staked>0 ? (s.profit/s.staked*100) : 0;
    var barW = Math.min(Math.abs(cRoi), 100);
    h += '<div style="padding:8px 0;border-bottom:1px solid var(--bd)">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">';
    h += '<div style="font-size:.74rem;color:var(--tx)">' + cs.course + ' <span style="color:var(--mt);font-size:.62rem">(' + s.races + ' races, ' + s.wins + ' hit)</span></div>';
    h += '<div style="font-family:var(--mono);font-size:.72rem;color:' + (s.profit>=0?'var(--g)':'var(--re)') + '">' + (s.profit>=0?'+':'') + '£' + s.profit.toFixed(2) + ' <span style="color:var(--mt);font-size:.6rem">(' + (cRoi>=0?'+':'') + cRoi.toFixed(0) + '%)</span></div>';
    h += '</div>';
    h += '<div style="height:4px;background:var(--bd);border-radius:2px;overflow:hidden"><div style="height:100%;width:' + barW + '%;background:' + (s.profit>=0?'var(--g)':'var(--re)') + '"></div></div>';
    h += '</div>';
  });

  // ── Per-race detail with course filter ──
  h += '<div style="font-family:var(--mono);font-size:.7rem;color:var(--gold);letter-spacing:1px;margin:18px 0 10px">📋 EVERY DUTCHED RACE</div>';
  h += '<div style="margin-bottom:10px"><select id="dutchCourseSel" onchange="setDutchCourseFilter(this.value)" style="width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font-size:.74rem">';
  h += '<option value="ALL"' + (_dutchCourseFilter==='ALL'?' selected':'') + '>All courses (' + totRaces + ' races)</option>';
  courses.forEach(function(c){
    h += '<option value="' + c.replace(/"/g,'') + '"' + (_dutchCourseFilter===c?' selected':'') + '>' + c + ' (' + byCourse[c].races + ')</option>';
  });
  h += '</select></div>';

  var shown = dutchRaces.slice().sort(function(a,b){ return (a.date+a.time) < (b.date+b.time) ? 1 : -1; });
  if (_dutchCourseFilter !== 'ALL') shown = shown.filter(function(e){ return courseKey(e.course) === courseKey(_dutchCourseFilter); });

  shown.slice(0, 60).forEach(function(e){
    var d = e.dutch;
    var resCol = d.won ? 'var(--g)' : 'var(--re)';
    var sels = (d.selections || []).map(function(n, i){
      var isWinner = d.winnerName === n;
      return '<span style="color:' + (isWinner?'var(--g)':'var(--mt)') + '">' + n.split(' ')[0] + ' @' + (d.odds[i]?d.odds[i].toFixed(1):'?') + (isWinner?' ✓':'') + '</span>';
    }).join(' · ');
    h += '<div style="background:var(--card);border:1px solid var(--bd);border-left:3px solid ' + resCol + ';border-radius:8px;padding:10px 12px;margin-bottom:6px">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">';
    h += '<div style="font-size:.74rem;color:var(--tx)">' + (e.course||'?') + ' <span style="color:var(--mt);font-size:.62rem">' + (e.time||'') + ' · ' + (e.date||'') + '</span></div>';
    h += '<div style="font-family:var(--mono);font-size:.74rem;font-weight:700;color:' + resCol + '">' + (d.profit>=0?'+':'') + '£' + d.profit.toFixed(2) + '</div>';
    h += '</div>';
    h += '<div style="font-family:var(--mono);font-size:.64rem">' + sels + '</div>';
    h += '<div style="font-family:var(--mono);font-size:.58rem;color:var(--mt);margin-top:3px">' + d.nSel + ' selection' + (d.nSel>1?'s':'') + ' · ' + (d.fieldSize||'?') + ' runners · £' + (d.outlay||10) + ' staked' + (d.won ? ' · returned £' + d.returned.toFixed(2) : ' · no winner') + '</div>';
    h += '</div>';
  });
  if (shown.length > 60) h += '<div style="font-family:var(--mono);font-size:.62rem;color:var(--mt);text-align:center;padding:8px">Showing latest 60 of ' + shown.length + '</div>';

  h += '</div>';
  el.innerHTML = h;
}

function setDutchCourseFilter(c) {
  _dutchCourseFilter = c;
  renderDutchTab();
}

// ══ CONFIDENCE PREDICTOR TAB ══════════════════════════════════════════════════
// Rebuilt from the log rather than needing its own record: a race "qualified"
// if the model's top pick was more than CONF_GAP points clear of the second,
// which is exactly the rule the app uses. So this shows full history from day
// one, not just from when the feature was added.
var CONF_GAP = 20;

function confGap(e) {
  var p = e.predictions || [];
  if (p.length < 2 || p[0].score == null || p[1].score == null) return null;
  return p[0].score - p[1].score;
}

function renderConfTab() {
  var el = document.getElementById('tab-conf');
  if (!el) return;
  if (!loadedLog || !loadedLog.length) {
    el.innerHTML = '<div style="padding:20px;font-family:var(--mono);font-size:.75rem;color:var(--mt)">Load a results JSON to see Confidence Predictor performance.</div>';
    return;
  }

  var q = loadedLog.filter(function(e){
    var g = confGap(e);
    return g !== null && g > CONF_GAP && (e.topPickOdds || 0) > 1;
  }).sort(function(a,b){ return (a.date + a.time) < (b.date + b.time) ? 1 : -1; });

  if (!q.length) {
    el.innerHTML = '<div style="padding:16px"><div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:20px;text-align:center;font-family:var(--mono);font-size:.72rem;color:var(--mt)">'
      + '<div style="font-size:1.6rem;margin-bottom:8px">🎯</div>No race has yet had a top pick more than ' + CONF_GAP + ' points clear.</div></div>';
    return;
  }

  function agg(rows) {
    var w = rows.filter(function(e){ return e.topPickWon; }).length;
    var pl = rows.filter(function(e){ return e.topPickPlaced && !e.topPickWon; }).length;
    var st = 10 * rows.length;
    var rt = rows.reduce(function(a,e){ return a + (e.topPickWon ? 10 * e.topPickOdds : 0); }, 0);
    var od = rows.reduce(function(a,e){ return a + e.topPickOdds; }, 0) / rows.length;
    return { n:rows.length, w:w, pl:pl, staked:st, profit:rt-st, roi:(rt-st)/st*100,
             strike:w/rows.length*100, avgOdds:od, frame:(w+pl)/rows.length*100 };
  }
  var A = agg(q);

  var h = '<div style="padding:16px">';

  // headline
  h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:8px">';
  function card(lbl, val, col, sub) {
    return '<div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:13px">'
      + '<div style="font-family:var(--mono);font-size:.55rem;color:var(--mt);letter-spacing:1px;margin-bottom:5px">' + lbl + '</div>'
      + '<div style="font-size:1.35rem;font-weight:700;color:' + col + '">' + val + '</div>'
      + (sub ? '<div style="font-family:var(--mono);font-size:.58rem;color:var(--mt);margin-top:2px">' + sub + '</div>' : '')
      + '</div>';
  }
  h += card('STRIKE RATE', A.strike.toFixed(1) + '%', 'var(--tx)', A.w + ' of ' + A.n);
  h += card('£10 LEVEL P/L', (A.profit>=0?'+':'-') + '£' + Math.abs(A.profit).toFixed(2), A.profit>=0?'var(--g)':'var(--re)', '£' + A.staked.toFixed(0) + ' staked');
  h += card('ROI', (A.roi>=0?'+':'') + A.roi.toFixed(1) + '%', A.roi>=0?'var(--g)':'var(--re)', 'avg odds ' + A.avgOdds.toFixed(2));
  h += '</div>';

  // the honest read
  var breakEven = 100 / A.avgOdds;
  h += '<div style="background:var(--card);border:1px solid ' + (A.roi>=0?'rgba(0,230,118,.35)':'rgba(255,193,7,.35)')
     + ';border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:.66rem;color:var(--mt);line-height:1.6">'
     + 'Picks win <b style="color:var(--tx)">' + A.strike.toFixed(0) + '%</b> of the time and hit the frame <b style="color:var(--tx)">'
     + A.frame.toFixed(0) + '%</b> — but at an average price of <b style="color:var(--tx)">' + A.avgOdds.toFixed(2)
     + '</b> you need <b style="color:var(--tx)">' + breakEven.toFixed(0) + '%</b> just to break even. '
     + (A.roi < 0 ? 'A big confidence gap identifies the likely winner, not a generous price.'
                  : 'Currently clearing that bar.')
     + '</div>';

  // by gap band — does a wider gap mean a better pick?
  h += '<div style="font-family:var(--mono);font-size:.7rem;color:var(--gold);letter-spacing:1px;margin:4px 0 8px">📏 BY CONFIDENCE GAP</div>';
  h += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.62rem">';
  h += '<tr style="color:var(--mt);text-align:right"><th style="text-align:left;padding:5px 4px;font-weight:400">Gap</th>'
     + '<th style="padding:5px 4px;font-weight:400">n</th><th style="padding:5px 4px;font-weight:400">Strike</th>'
     + '<th style="padding:5px 4px;font-weight:400">Avg odds</th><th style="padding:5px 4px;font-weight:400">ROI</th></tr>';
  [[20,25,'20–25'],[25,30,'25–30'],[30,40,'30–40'],[40,999,'40+']].forEach(function(b){
    var rows = q.filter(function(e){ var g=confGap(e); return g>=b[0] && g<b[1]; });
    if (rows.length < 5) return;
    var a = agg(rows);
    h += '<tr style="text-align:right;border-top:1px solid var(--bd)">'
       + '<td style="text-align:left;padding:6px 4px;color:var(--tx);font-weight:600">' + b[2] + ' pts</td>'
       + '<td style="padding:6px 4px;color:var(--mt)">' + a.n + '</td>'
       + '<td style="padding:6px 4px;color:var(--tx)">' + a.strike.toFixed(0) + '%</td>'
       + '<td style="padding:6px 4px;color:var(--mt)">' + a.avgOdds.toFixed(2) + '</td>'
       + '<td style="padding:6px 4px;font-weight:700;color:' + (a.roi>=0?'var(--g)':'var(--re)') + '">'
       + (a.roi>=0?'+':'') + a.roi.toFixed(0) + '%</td></tr>';
  });
  h += '</table></div>';

  // recent picks
  h += '<div style="font-family:var(--mono);font-size:.7rem;color:var(--gold);letter-spacing:1px;margin:18px 0 8px">🎯 QUALIFIERS</div>';
  q.slice(0, 60).forEach(function(e){
    var won = !!e.topPickWon, plc = !won && !!e.topPickPlaced;
    var col = won ? 'var(--g)' : plc ? 'var(--gold)' : 'var(--re)';
    var badge = won ? '✓ WON' : plc ? 'PLACED' : 'LOST';
    var bg = won ? 'rgba(0,230,118,0.08)' : 'var(--card)';
    var bs = won ? 'display:inline-block;background:var(--g);color:#04120a;font-weight:800;padding:2px 8px;border-radius:5px;font-family:var(--mono);font-size:.62rem'
                 : 'font-family:var(--mono);font-size:.66rem;font-weight:700;color:' + col;
    var pl = won ? (10*e.topPickOdds - 10) : -10;
    var nm = (e.predictions && e.predictions[0]) ? e.predictions[0].name : '?';
    h += '<div style="background:' + bg + ';border:1px solid var(--bd);border-left:3px solid ' + col + ';border-radius:8px;padding:9px 12px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center">';
    h += '<div style="min-width:0"><div style="font-size:.73rem;color:var(--tx);font-weight:600">' + esc(nm)
       + ' <span style="color:var(--mt);font-weight:400">@' + e.topPickOdds.toFixed(2) + '</span></div>';
    h += '<div style="font-family:var(--mono);font-size:.58rem;color:var(--mt);margin-top:2px">' + (e.date||'') + ' · '
       + esc(courseName(e.course)) + ' ' + (e.time||'') + ' · +' + confGap(e) + ' pts clear</div></div>';
    h += '<div style="text-align:right"><div style="' + bs + '">' + badge + '</div>'
       + '<div style="font-family:var(--mono);font-size:.6rem;color:' + (pl>=0?'var(--g)':'var(--re)') + ';margin-top:3px">'
       + (pl>=0?'+':'-') + '£' + Math.abs(pl).toFixed(2) + '</div></div></div>';
  });
  if (q.length > 60) h += '<div style="font-family:var(--mono);font-size:.6rem;color:var(--mt);text-align:center;padding:8px">Showing latest 60 of ' + q.length + '</div>';

  h += '</div>';
  el.innerHTML = h;
}

// ══ NAP TAB ═══════════════════════════════════════════════════════════════════
// Day-by-day record of the Nap of the Day: won / placed / lost, odds, and
// £10 level-stakes P/L. Uses napName/napWon logged with each race; nap odds
// are looked up from the race's own predictions array.
function renderNapTab() {
  var el = document.getElementById('tab-nap');
  if (!el) return;
  if (!loadedLog || !loadedLog.length) {
    el.innerHTML = '<div style="padding:20px;font-family:var(--mono);font-size:.75rem;color:var(--mt)">Load a results JSON to see nap performance.</div>';
    return;
  }

  var napRaces = loadedLog.filter(function(e){ return e.napName; });
  if (!napRaces.length) {
    // No daily Nap captured, but per-course picks may still exist — show those.
    var coursePicksOnly = renderCoursePicks();
    el.innerHTML = '<div style="padding:16px">'
      + '<div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;text-align:center;font-family:var(--mono);font-size:.72rem;color:var(--mt);margin-bottom:' + (coursePicksOnly ? '4px' : '0') + '">'
      + '<div style="font-size:1.6rem;margin-bottom:8px">⭐</div>'
      + 'No daily Nap captured for these dates.' + (coursePicksOnly ? '<br>Per-course top picks are shown below.' : '<br><br>This populates once races with a locked Nap of the Day have results logged.')
      + '</div>'
      + coursePicksOnly
      + '</div>';
    return;
  }

  // Enrich each nap entry: odds (from its predictions), placed, £10 P/L
  var naps = napRaces.map(function(e){
    var pred = (e.predictions || []).filter(function(p){ return p.name === e.napName; })[0];
    var odds = pred && pred.odds > 1 ? pred.odds : 0;
    var won = !!e.napWon;
    // placed = in the actual result beyond the winner slot
    var placed = !won && (e.actual || []).indexOf(e.napName) > 0;
    var pl = odds > 1 ? (won ? +(10 * odds - 10).toFixed(2) : -10) : (won ? 0 : (odds ? -10 : 0));
    return { date: e.date || '?', course: e.course || '?', time: e.time || '',
             name: e.napName, odds: odds, won: won, placed: placed, pl: pl, hasOdds: odds > 1 };
  }).sort(function(a,b){ return (a.date + a.time) < (b.date + b.time) ? 1 : -1; });

  var tot = naps.length;
  var wins = naps.filter(function(n){ return n.won; }).length;
  var placedCt = naps.filter(function(n){ return n.placed; }).length;
  var priced = naps.filter(function(n){ return n.hasOdds; });
  var totStaked = priced.length * 10;
  var totPL = priced.reduce(function(s,n){ return s + n.pl; }, 0);
  var roi = totStaked > 0 ? (totPL / totStaked * 100) : 0;

  var h = '<div style="padding:16px">';

  // ── Latest nap banner — the "did today's nap win?" answer ──
  var latest = naps[0];
  var lCol = latest.won ? 'var(--g)' : latest.placed ? 'var(--gold)' : 'var(--re)';
  var lTxt = latest.won ? '✓ WON' : latest.placed ? 'PLACED' : 'LOST';
  h += '<div style="background:var(--card);border:1px solid ' + lCol + ';border-radius:10px;padding:14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center">';
  h += '<div><div style="font-family:var(--mono);font-size:.58rem;color:var(--mt);letter-spacing:1px;margin-bottom:4px">LATEST NAP · ' + latest.date + '</div>';
  h += '<div style="font-size:.95rem;font-weight:700;color:var(--tx)">' + latest.name + '</div>';
  h += '<div style="font-family:var(--mono);font-size:.62rem;color:var(--mt);margin-top:2px">' + latest.course + ' ' + latest.time + (latest.hasOdds ? ' · @' + latest.odds.toFixed(2) : '') + '</div></div>';
  h += '<div style="font-size:1.1rem;font-weight:800;color:' + lCol + '">' + lTxt + '</div>';
  h += '</div>';

  // ── Headline stats ──
  h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">';
  h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px">';
  h += '<div style="font-family:var(--mono);font-size:.58rem;color:var(--mt);letter-spacing:1px;margin-bottom:6px">£10 LEVEL P/L</div>';
  h += '<div style="font-size:1.5rem;font-weight:700;color:' + (totPL>=0?'var(--g)':'var(--re)') + '">' + (totPL>=0?'+':'') + '£' + totPL.toFixed(2) + '</div>';
  h += '<div style="font-family:var(--mono);font-size:.62rem;color:var(--mt);margin-top:2px">' + priced.length + ' priced naps</div>';
  h += '</div>';
  h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px">';
  h += '<div style="font-family:var(--mono);font-size:.58rem;color:var(--mt);letter-spacing:1px;margin-bottom:6px">ROI</div>';
  h += '<div style="font-size:1.5rem;font-weight:700;color:' + (roi>=0?'var(--g)':'var(--re)') + '">' + (roi>=0?'+':'') + roi.toFixed(1) + '%</div>';
  h += '<div style="font-family:var(--mono);font-size:.62rem;color:var(--mt);margin-top:2px">£' + totStaked.toFixed(0) + ' staked</div>';
  h += '</div>';
  h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px">';
  h += '<div style="font-family:var(--mono);font-size:.58rem;color:var(--mt);letter-spacing:1px;margin-bottom:6px">STRIKE RATE</div>';
  h += '<div style="font-size:1.5rem;font-weight:700;color:var(--tx)">' + Math.round(wins/tot*100) + '%</div>';
  h += '<div style="font-family:var(--mono);font-size:.62rem;color:var(--mt);margin-top:2px">' + wins + ' won · ' + placedCt + ' placed / ' + tot + '</div>';
  h += '</div>';
  h += '</div>';

  // ── Day-by-day list ──
  // ── Naps grouped by day ──
  // One nap per racecourse per day, grouped under each date with that day's
  // record, so you can see "the best of each track" and how the day went.
  h += '<div style="font-family:var(--mono);font-size:.7rem;color:var(--gold);letter-spacing:1px;margin:18px 0 10px">📅 NAPS BY DAY</div>';

  var byDay = {};
  naps.forEach(function(n){ (byDay[n.date] = byDay[n.date] || []).push(n); });
  var days = Object.keys(byDay).sort().reverse();

  days.slice(0, 30).forEach(function(day){
    var list = byDay[day].slice().sort(function(a,b){ return a.time < b.time ? -1 : 1; });
    var dWon = list.filter(function(n){ return n.won; }).length;
    var dPl  = list.filter(function(n){ return n.placed; }).length;
    var dPriced = list.filter(function(n){ return n.hasOdds; });
    var dProfit = dPriced.reduce(function(s2,n){ return s2 + n.pl; }, 0);
    var dCol = dProfit > 0 ? 'var(--g)' : dProfit < 0 ? 'var(--re)' : 'var(--mt)';

    // Day header with that day's record
    h += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--bd)">';
    h += '<div style="font-family:var(--mono);font-size:.68rem;color:var(--tx);font-weight:700">' + day + '</div>';
    h += '<div style="font-family:var(--mono);font-size:.62rem;color:var(--mt)">'
       + dWon + '/' + list.length + ' won' + (dPl ? ' · ' + dPl + ' placed' : '')
       + (dPriced.length ? ' · <span style="color:' + dCol + '">' + (dProfit>=0?'+':'') + '£' + dProfit.toFixed(2) + '</span>' : '')
       + '</div></div>';

    list.forEach(function(n){
      var col = n.won ? 'var(--g)' : n.placed ? 'var(--gold)' : 'var(--re)';
      var badge = n.won ? '✓ WON' : n.placed ? 'PLACED' : 'LOST';
      var rowBg = n.won ? 'rgba(0,230,118,0.08)' : 'var(--card)';
      var badgeStyle = n.won
        ? 'display:inline-block;background:var(--g);color:#04120a;font-weight:800;padding:2px 8px;border-radius:5px;font-family:var(--mono);font-size:.64rem'
        : 'font-family:var(--mono);font-size:.68rem;font-weight:700;color:' + col;
      h += '<div style="background:' + rowBg + ';border:1px solid var(--bd);border-left:3px solid ' + col + ';border-radius:8px;padding:9px 12px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center">';
      h += '<div><div style="font-size:.74rem;color:var(--tx);font-weight:600">' + n.name
         + (n.hasOdds ? ' <span style="color:var(--mt);font-weight:400">@' + n.odds.toFixed(2) + '</span>' : '') + '</div>';
      h += '<div style="font-family:var(--mono);font-size:.6rem;color:var(--mt);margin-top:2px">' + n.time + ' ' + n.course + '</div></div>';
      h += '<div style="text-align:right"><div style="' + badgeStyle + '">' + badge + '</div>';
      if (n.hasOdds) h += '<div style="font-family:var(--mono);font-size:.6rem;color:' + (n.pl>=0?'var(--g)':'var(--re)') + ';margin-top:3px">' + (n.pl>=0?'+':'') + '£' + n.pl.toFixed(2) + '</div>';
      h += '</div></div>';
    });
  });
  if (days.length > 30) h += '<div style="font-family:var(--mono);font-size:.62rem;color:var(--mt);text-align:center;padding:8px">Showing latest 30 days of ' + days.length + '</div>';

  // ── Per-course top pick (the strongest selection at each meeting) ──
  // Derived from the full log, so it covers every course on every day —
  // including days the daily Nap wasn't captured. For each course+date we
  // take that meeting's highest-confidence logged race as its "course pick".
  h += renderCoursePicks();

  h += '</div>';
  el.innerHTML = h;
}

// Build the per-course best-pick block. Groups the log by course+date,
// selects each meeting's top-confidence race, and reports win/place/P&L.
function renderCoursePicks() {
  var byMeeting = {}; // course|date -> best entry (highest topPickConf)
  loadedLog.forEach(function(e){
    if (!e.course || !e.predictions || !e.predictions.length) return;
    var key = courseKey(e.course) + '|' + (e.date || '?');
    var cur = byMeeting[key];
    if (!cur || (e.topPickConf || 0) > (cur.topPickConf || 0)) byMeeting[key] = e;
  });

  var picks = Object.keys(byMeeting).map(function(k){
    var e = byMeeting[k];
    var name = e.predictions[0] ? e.predictions[0].name : '?';
    var odds = e.predictions[0] && e.predictions[0].odds > 1 ? e.predictions[0].odds : 0;
    var won = !!e.topPickWon;
    var placed = !won && !!e.topPickPlaced;
    var pl = odds > 1 ? (won ? +(10*odds-10).toFixed(2) : -10) : 0;
    return { course:e.course, date:e.date||'?', time:e.time||'', name:name, odds:odds,
             won:won, placed:placed, pl:pl, hasOdds:odds>1, conf:e.topPickConf||0 };
  }).sort(function(a,b){ return (a.date+a.course) < (b.date+b.course) ? 1 : -1; });

  if (!picks.length) return '';

  var tot = picks.length;
  var wins = picks.filter(function(p){ return p.won; }).length;
  var placedCt = picks.filter(function(p){ return p.placed; }).length;
  var priced = picks.filter(function(p){ return p.hasOdds; });
  var staked = priced.length * 10;
  var pl = priced.reduce(function(s,p){ return s + p.pl; }, 0);
  var roi = staked > 0 ? (pl/staked*100) : 0;

  var h = '<div style="font-family:var(--mono);font-size:.7rem;color:var(--gold);letter-spacing:1px;margin:24px 0 10px">🏇 TOP PICK BY COURSE</div>';
  h += '<div style="font-family:var(--mono);font-size:.6rem;color:var(--mt);margin-bottom:10px;line-height:1.5">The strongest model selection at each meeting, every day — covers all courses even when the daily Nap wasn\'t captured.</div>';

  // headline
  h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px">';
  h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px">';
  h += '<div style="font-family:var(--mono);font-size:.55rem;color:var(--mt);letter-spacing:1px;margin-bottom:5px">£10 LEVEL P/L</div>';
  h += '<div style="font-size:1.3rem;font-weight:700;color:' + (pl>=0?'var(--g)':'var(--re)') + '">' + (pl>=0?'+':'') + '£' + pl.toFixed(2) + '</div></div>';
  h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px">';
  h += '<div style="font-family:var(--mono);font-size:.55rem;color:var(--mt);letter-spacing:1px;margin-bottom:5px">ROI</div>';
  h += '<div style="font-size:1.3rem;font-weight:700;color:' + (roi>=0?'var(--g)':'var(--re)') + '">' + (roi>=0?'+':'') + roi.toFixed(1) + '%</div></div>';
  h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px">';
  h += '<div style="font-family:var(--mono);font-size:.55rem;color:var(--mt);letter-spacing:1px;margin-bottom:5px">STRIKE</div>';
  h += '<div style="font-size:1.3rem;font-weight:700;color:var(--tx)">' + Math.round(wins/tot*100) + '%</div>';
  h += '<div style="font-family:var(--mono);font-size:.58rem;color:var(--mt);margin-top:2px">' + wins + 'W ' + placedCt + 'P / ' + tot + '</div></div>';
  h += '</div>';

  picks.slice(0, 80).forEach(function(p){
    var col = p.won ? 'var(--g)' : p.placed ? 'var(--gold)' : 'var(--re)';
    var badge = p.won ? '✓ WON' : p.placed ? 'PLACED' : 'LOST';
    var rowBg = p.won ? 'rgba(0,230,118,0.08)' : 'var(--card)';
    var badgeStyle = p.won
      ? 'display:inline-block;background:var(--g);color:#04120a;font-weight:800;padding:2px 8px;border-radius:5px;font-family:var(--mono);font-size:.64rem'
      : 'font-family:var(--mono);font-size:.68rem;font-weight:700;color:' + col;
    h += '<div style="background:' + rowBg + ';border:1px solid var(--bd);border-left:3px solid ' + col + ';border-radius:8px;padding:9px 12px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center">';
    h += '<div><div style="font-size:.72rem;color:var(--tx);font-weight:600">' + p.course + ' <span style="color:var(--mt);font-weight:400">· ' + p.name + (p.hasOdds ? ' @' + p.odds.toFixed(2) : '') + '</span></div>';
    h += '<div style="font-family:var(--mono);font-size:.58rem;color:var(--mt);margin-top:2px">' + p.date + (p.time?' ' + p.time:'') + '</div></div>';
    h += '<div style="text-align:right"><div style="' + badgeStyle + '">' + badge + '</div>';
    if (p.hasOdds) h += '<div style="font-family:var(--mono);font-size:.6rem;color:' + (p.pl>=0?'var(--g)':'var(--re)') + ';margin-top:3px">' + (p.pl>=0?'+':'') + '£' + p.pl.toFixed(2) + '</div>';
    h += '</div></div>';
  });
  if (picks.length > 80) h += '<div style="font-family:var(--mono);font-size:.6rem;color:var(--mt);text-align:center;padding:8px">Showing latest 80 of ' + picks.length + '</div>';

  return h;
}

</script>
