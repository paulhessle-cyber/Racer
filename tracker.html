<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🏇 Bet Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');
:root{--g:#00e676;--gold:#ffc107;--bg:#07100a;--sf:#0e1a11;--sf2:#132017;--bd:#1c3024;--tx:#c8ddd0;--mt:#4a6a55;--bl:#40c4ff;--re:#ff5252}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:72px}
.hdr{background:#0b1a0e;border-bottom:1px solid var(--bd);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--g);letter-spacing:3px}
.pl-pill{font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:600;padding:5px 12px;border-radius:20px;border:1px solid var(--bd);color:var(--mt)}
.pl-pill.pos{border-color:var(--g);color:var(--g);background:rgba(0,230,118,.1)}
.pl-pill.neg{border-color:var(--re);color:var(--re);background:rgba(255,82,82,.1)}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#0b1a0e;border-top:1px solid var(--bd);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom)}
.bnav-tab{flex:1;padding:10px 4px 8px;text-align:center;cursor:pointer;border:none;background:transparent;color:var(--mt);font-family:'IBM Plex Mono',monospace;font-size:.55rem;letter-spacing:.5px;text-transform:uppercase}
.bnav-tab .ico{font-size:1.3rem;display:block;margin-bottom:2px}
.bnav-tab.on{color:var(--g)}
.scr{display:none;padding:14px 14px 16px}
.scr.on{display:block}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.ct{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--g);letter-spacing:2px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.sg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.sbox{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:14px 10px;text-align:center}
.sval{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;line-height:1;margin-bottom:3px}
.slbl{font-size:.58rem;color:var(--mt);text-transform:uppercase;letter-spacing:1px}
.sval.pos{color:var(--g)}.sval.neg{color:var(--re)}.sval.neu{color:var(--gold)}.sval.wh{color:var(--tx)}
.hero{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px 16px;margin-bottom:12px;text-align:center}
.hero-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:2px;color:var(--mt);margin-bottom:6px}
.hero-val{font-family:'Bebas Neue',sans-serif;font-size:3.5rem;line-height:1;letter-spacing:2px}
.hero-val.pos{color:var(--g)}.hero-val.neg{color:var(--re)}
.hero-sub{font-size:.75rem;color:var(--mt);margin-top:6px;font-family:'IBM Plex Mono',monospace}
.chart-wrap{width:100%;height:160px;margin-bottom:6px}
canvas{width:100%!important;height:100%!important}
.chart-note{font-size:.6rem;color:var(--mt);text-align:right;font-family:'IBM Plex Mono',monospace}
.insight{padding:10px 13px;border-radius:8px;font-size:.8rem;margin-bottom:8px;border-left:3px solid;line-height:1.55}
.ig{background:rgba(0,230,118,.07);border-color:var(--g);color:#9ef5c0}
.iw{background:rgba(255,193,7,.07);border-color:var(--gold);color:#ffe082}
.ir{background:rgba(255,82,82,.07);border-color:var(--re);color:#ff8a80}
.ib{background:rgba(64,196,255,.07);border-color:var(--bl);color:#80d8ff}
.trend{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.7rem;padding:4px 10px;border-radius:4px;margin-bottom:10px}
.trend.up{background:rgba(0,230,118,.12);color:var(--g)}
.trend.dn{background:rgba(255,82,82,.12);color:var(--re)}
.trend.fl{background:rgba(255,193,7,.1);color:var(--gold)}
.day-card{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.day-card.win{border-left:3px solid var(--g)}
.day-card.loss{border-left:3px solid var(--re)}
.day-date{font-size:.7rem;color:var(--mt);font-family:'IBM Plex Mono',monospace;white-space:nowrap}
.day-type{font-size:.62rem;color:var(--mt);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.day-notes{font-size:.65rem;color:var(--mt);margin-top:3px;line-height:1.3}
.day-pl{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;text-align:right;white-space:nowrap;flex-shrink:0}
.day-pl.pos{color:var(--g)}.day-pl.neg{color:var(--re)}
.day-stake{font-size:.6rem;color:var(--mt);text-align:right;font-family:'IBM Plex Mono',monospace}
.day-del{background:transparent;border:none;color:var(--bd);font-size:.9rem;cursor:pointer;padding:6px;flex-shrink:0}
.day-del:active{color:var(--re)}
.retrain-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bl);margin-left:5px;vertical-align:middle}
.fl{font-size:.62rem;text-transform:uppercase;letter-spacing:1px;color:var(--mt);margin-bottom:5px}
.fi{width:100%;background:#0a0f0d;border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:'IBM Plex Mono',monospace;font-size:1rem;padding:12px;outline:none;-webkit-appearance:none;margin-bottom:10px}
.fi:focus{border-color:var(--g)}
.fi.gold{color:var(--gold)}
.fi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font-family:'IBM Plex Mono',monospace;font-size:.8rem;font-weight:600;letter-spacing:.8px;text-transform:uppercase;padding:14px 16px;border:none;border-radius:10px;cursor:pointer;width:100%;margin-top:4px}
.bg{background:var(--g);color:var(--bg)}
.bo{background:transparent;color:var(--g);border:1px solid var(--g)}
.bt-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.bt{padding:9px 14px;border-radius:20px;border:1px solid var(--bd);cursor:pointer;font-size:.72rem;font-family:'IBM Plex Mono',monospace;color:var(--mt);background:var(--sf2)}
.bt.on{border-color:var(--g);color:var(--g);background:rgba(0,230,118,.1)}
.retrain-row{display:flex;align-items:center;gap:10px;padding:12px;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;margin-bottom:10px}
.retrain-row label{font-size:.8rem;color:var(--mt);flex:1;cursor:pointer}
.toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;background:var(--bd);border-radius:11px;cursor:pointer;transition:.2s}
.toggle input:checked+.toggle-track{background:var(--bl)}
.toggle-thumb{position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s;pointer-events:none}
.toggle input:checked~.toggle-thumb{left:21px}
.add-status{min-height:20px;margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:.75rem}
.edit-panel{display:none;background:#0a0f0d;border-top:1px solid var(--bd);padding:12px;margin-top:2px;border-radius:0 0 10px 10px}
.edit-panel.open{display:block}
.edit-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.edit-inp{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font-family:'IBM Plex Mono',monospace;font-size:.9rem;padding:9px 10px;outline:none;-webkit-appearance:none}
.edit-inp:focus{border-color:var(--g)}
.edit-inp.gold{color:var(--gold)}
.edit-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.edit-save{background:var(--g);color:var(--bg);border:none;border-radius:7px;padding:10px;font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:600;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;width:100%}
.edit-cancel{background:transparent;color:var(--mt);border:1px solid var(--bd);border-radius:7px;padding:10px;font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:600;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;width:100%}
.day-edit{background:transparent;border:none;color:var(--mt);font-size:.85rem;cursor:pointer;padding:6px;flex-shrink:0}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-title">🏇 Tracker</div>
  <div class="pl-pill" id="plPill">—</div>
</div>

<!-- OVERVIEW -->

<div class="scr on" id="s-overview">
  <div class="hero">
    <div class="hero-lbl">Season P/L</div>
    <div class="hero-val" id="heroVal">—</div>
    <div class="hero-sub" id="heroSub">—</div>
  </div>
  <div class="sg3" id="statsTop"></div>
  <div class="sg2" id="statsBot"></div>
  <div id="trendWrap" style="margin-bottom:10px"></div>
  <div id="clvSection"></div>
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div class="ct" style="margin-bottom:0;padding-bottom:0;border-bottom:none">Running P/L</div>
      <span id="peakNote" style="font-size:.62rem;color:var(--mt);font-family:'IBM Plex Mono',monospace"></span>
    </div>
    <div class="chart-wrap"><canvas id="plChart"></canvas></div>
    <div class="chart-note">· · · breakeven &nbsp;|&nbsp; R = retrain</div>
  </div>
  <div id="insightsBox"></div>
</div>

<!-- LOG -->

<div class="scr" id="s-log">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--g);letter-spacing:2px">Full Log</div>
    <button onclick="exportCSV()" style="font-family:'IBM Plex Mono',monospace;font-size:.65rem;font-weight:600;letter-spacing:.8px;text-transform:uppercase;padding:7px 14px;border-radius:8px;background:transparent;color:var(--g);border:1px solid var(--g);cursor:pointer">⬇ CSV</button>
  </div>
  <div id="logCards"></div>
</div>

<!-- ADD -->

<div class="scr" id="s-add">
  <div class="card">
    <div class="ct">Log Today's Bet</div>
    <div class="fl">Bet Type</div>
    <div class="bt-wrap">
      <div class="bt on" onclick="setBetType(this,'Lucky 15')">Lucky 15</div>
      <div class="bt" onclick="setBetType(this,'Placepot')">Placepot</div>
      <div class="bt" onclick="setBetType(this,'Each Way')">Each Way</div>
      <div class="bt" onclick="setBetType(this,'Win')">Win</div>
      <div class="bt" onclick="setBetType(this,'Other')">Other</div>
    </div>
    <div class="fl">Date</div>
    <input class="fi" type="date" id="fDate">
    <div class="fi-row" style="margin-bottom:0">
      <div>
        <div class="fl">Stake £</div>
        <input class="fi gold" type="number" id="fSpent" min="0" step="0.5" placeholder="15.00" inputmode="decimal">
      </div>
      <div>
        <div class="fl">Returned £</div>
        <input class="fi gold" type="number" id="fWon" min="0" step="0.01" placeholder="0.00" inputmode="decimal">
      </div>
    </div>
    <div class="fi-row" style="margin-bottom:0">
      <div>
        <div class="fl">Odds Taken</div>
        <input class="fi gold" type="number" id="fOdds" min="1" step="0.1" placeholder="e.g. 4.5" inputmode="decimal">
      </div>
      <div>
        <div class="fl">Starting Price (SP)</div>
        <input class="fi gold" type="number" id="fSP" min="1" step="0.1" placeholder="e.g. 4.0" inputmode="decimal">
      </div>
    </div>
    <div class="fl">Notes</div>
    <input class="fi" type="text" id="fNotes" placeholder="e.g. 3/6 placepot, 2 wins…">
    <div class="retrain-row" onclick="document.getElementById('fRetrain').click()" style="cursor:pointer">
      <label style="cursor:pointer;pointer-events:none">Model retrained today</label>
      <div class="toggle" style="pointer-events:none">
        <input type="checkbox" id="fRetrain" style="display:none">
        <div class="toggle-track" id="toggleTrack"></div>
        <div class="toggle-thumb" id="toggleThumb"></div>
      </div>
    </div>
    <button class="btn bg" onclick="addEntry()">+ Add Result</button>
    <div class="add-status" id="addStatus"></div>
  </div>
</div>

<!-- Nav -->

<div class="bnav">
  <button class="bnav-tab on" id="nav-overview" onclick="goTab('overview')">
    <span class="ico">📊</span>Overview
  </button>
  <button class="bnav-tab" id="nav-log" onclick="goTab('log')">
    <span class="ico">📋</span>Log
  </button>
  <button class="bnav-tab" id="nav-add" onclick="goTab('add')">
    <span class="ico">➕</span>Add
  </button>
</div>

<script>
var SEED=[
  {date:'2025-03-19',type:'Lucky 15',spent:24,   won:98.66,notes:'',        retrain:false},
  {date:'2025-03-20',type:'Lucky 15',spent:25,   won:27.35,notes:'',        retrain:false},
  {date:'2025-03-21',type:'Lucky 15',spent:21,   won:8.25, notes:'',        retrain:false},
  {date:'2025-03-22',type:'Lucky 15',spent:19,   won:39.15,notes:'',        retrain:false},
  {date:'2025-03-23',type:'Lucky 15',spent:20,   won:11.54,notes:'',        retrain:false},
  {date:'2025-03-24',type:'Lucky 15',spent:16,   won:19.33,notes:'',        retrain:false},
  {date:'2025-03-25',type:'Lucky 15',spent:19.5, won:11.46,notes:'',        retrain:false},
  {date:'2025-03-26',type:'Lucky 15',spent:17,   won:7.60, notes:'Retrained model',retrain:true},
  {date:'2025-03-27',type:'Lucky 15',spent:17,   won:1.20, notes:'',        retrain:false},
  {date:'2025-03-28',type:'Lucky 15',spent:15,   won:11.80,notes:'',        retrain:false},
  {date:'2025-03-29',type:'Lucky 15',spent:9,    won:0,    notes:'',        retrain:false},
  {date:'2025-03-30',type:'Lucky 15',spent:10,   won:0,    notes:'Retrained model',retrain:true},
  {date:'2025-03-31',type:'Lucky 15',spent:15,   won:5.36, notes:'',        retrain:false},
  {date:'2025-04-01',type:'Lucky 15',spent:9,    won:5.50, notes:'',        retrain:false},
  {date:'2025-04-02',type:'Lucky 15',spent:7,    won:4.90, notes:'',        retrain:false},
  {date:'2025-04-03',type:'Lucky 15',spent:21,   won:10.56,notes:'',        retrain:false},
  {date:'2025-04-04',type:'Lucky 15',spent:19,   won:11.87,notes:'1 win 1 place, still lost. Retrained.',retrain:true},
];

var LS_KEY='rp_results_v2';
var DATA=(function(){
  try{var r=localStorage.getItem(LS_KEY);if(r)return JSON.parse(r);}catch(e){}
  localStorage.setItem(LS_KEY,JSON.stringify(SEED));
  return SEED.slice();
})();

function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(DATA));}catch(e){}}
function sortedData(){return DATA.slice().sort(function(a,b){return a.date<b.date?-1:1;});}

function goTab(t){
  ['overview','log','add'].forEach(function(id){
    document.getElementById('s-'+id).classList.toggle('on',id===t);
    document.getElementById('nav-'+id).classList.toggle('on',id===t);
  });
  if(t==='log')renderLog();
}

var curType='Lucky 15';
function setBetType(el,t){
  curType=t;
  document.querySelectorAll('.bt').forEach(function(b){b.classList.remove('on');});
  el.classList.add('on');
}

(function(){
  var n=new Date();
  document.getElementById('fDate').value=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
})();

function calc(data){
  if(!data.length)return{days:0,spent:0,won:0,net:0,roi:0,winDays:0,lossDays:0,running:[],best:0,worst:0,last5:0,avgStake:0,avgReturn:0};
  var spent=0,won=0,winDays=0,lossDays=0,running=[],cum=0,best=-9999,worst=9999;
  data.forEach(function(r){
    var pl=r.won-r.spent;spent+=r.spent;won+=r.won;cum+=pl;
    running.push(Math.round(cum*100)/100);
    if(pl>0){winDays++;if(pl>best)best=pl;}
    if(pl<=0){lossDays++;if(pl<worst)worst=pl;}
  });
  var net=won-spent;
  var last5=data.slice(-5).reduce(function(s,r){return s+(r.won-r.spent);},0);
  var uniqueDays=Object.keys(data.reduce(function(m,r){m[r.date]=1;return m;},{})).length;

  // Closing Line Value: % of bets where your odds > SP
  var clvBets   = data.filter(function(r){ return r.odds>0 && r.sp>0; });
  var clvBeaten = clvBets.filter(function(r){ return r.odds >= r.sp; }).length;
  var clvPct    = clvBets.length > 0 ? Math.round(clvBeaten/clvBets.length*100) : null;
  var avgEdge   = clvBets.length > 0
    ? Math.round(clvBets.reduce(function(s,r){ return s+((r.odds-r.sp)/r.sp*100); },0) / clvBets.length * 10) / 10
    : null;

  // Drawdown: max peak-to-trough, current drawdown from peak
  var peak = 0, maxDD = 0, curDD = 0;
  running.forEach(function(v){
    if (v > peak) peak = v;
    var dd = peak - v;
    if (dd > maxDD) maxDD = dd;
  });
  curDD = peak - (running[running.length-1]||0);

  // Losing streak
  var maxLoseStreak = 0, curStreak = 0;
  data.forEach(function(r){ var pl=r.won-r.spent; if(pl<=0){curStreak++;if(curStreak>maxLoseStreak)maxLoseStreak=curStreak;}else{curStreak=0;} });

  var uniqueDays2=Object.keys(data.reduce(function(m,r){m[r.date]=1;return m;},{})).length;
  return{
    days:data.length, uniqueDays:uniqueDays2,
    spent:Math.round(spent*100)/100, won:Math.round(won*100)/100,
    net:Math.round(net*100)/100, roi:Math.round(net/spent*10000)/100,
    winDays, lossDays, running,
    best:Math.round(best*100)/100, worst:Math.round(worst*100)/100,
    last5:Math.round(last5*100)/100,
    avgStake:Math.round(spent/data.length*100)/100,
    avgReturn:Math.round(won/data.length*100)/100,
    clvPct, avgEdge, clvCount:clvBets.length,
    maxDD:Math.round(maxDD*100)/100,
    curDD:Math.round(curDD*100)/100,
    maxLoseStreak
  };
}

function sbox(v,l,c){return'<div class="sbox"><div class="sval '+c+'">'+v+'</div><div class="slbl">'+l+'</div></div>';}

function render(){
  var d=sortedData();
  var s=calc(d);

  var pill=document.getElementById('plPill');
  var ns=(s.net>=0?'+':'')+'£'+Math.abs(s.net).toFixed(2);
  pill.textContent=ns;
  pill.className='pl-pill '+(s.net>=0?'pos':'neg');

  document.getElementById('heroVal').textContent=(s.net>=0?'+':'')+'£'+Math.abs(s.net).toFixed(2);
  document.getElementById('heroVal').className='hero-val '+(s.net>=0?'pos':'neg');
  document.getElementById('heroSub').textContent=s.days+' bets · '+s.uniqueDays+' days · £'+s.spent.toFixed(2)+' staked · '+s.roi.toFixed(1)+'% ROI';

  document.getElementById('statsTop').innerHTML=
    sbox(s.winDays+'/'+s.uniqueDays,'Win Days','wh')+
    sbox(s.roi.toFixed(1)+'%','ROI',s.roi>=0?'pos':'neg')+
    sbox('£'+s.avgStake.toFixed(2),'Avg Stake','neu');
  document.getElementById('statsBot').innerHTML=
    sbox('+£'+s.best.toFixed(2),'Best Day','pos')+
    sbox('£'+s.worst.toFixed(2),'Worst Day','neg');

  // CLV section
  var clvEl = document.getElementById('clvSection');
  if (clvEl) {
    if (s.clvCount >= 3) {
      var clvColor = s.clvPct >= 50 ? 'var(--g)' : 'var(--re)';
      var edgeColor = s.avgEdge >= 0 ? 'var(--g)' : 'var(--re)';
      clvEl.innerHTML =
        '<div style="background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px">'
        + '<div style="font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--mt);margin-bottom:10px">📈 Closing Line Value — beating the market</div>'
        + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">'
          + '<div style="background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center">'
            + '<div style="font-size:1.8rem;font-weight:700;color:'+clvColor+';line-height:1">' + s.clvPct + '%</div>'
            + '<div style="font-size:.58rem;color:var(--mt);text-transform:uppercase;letter-spacing:1px;margin-top:3px">CLV Rate</div>'
          + '</div>'
          + '<div style="background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center">'
            + '<div style="font-size:1.8rem;font-weight:700;color:'+edgeColor+';line-height:1">' + (s.avgEdge>=0?'+':'') + s.avgEdge + '%</div>'
            + '<div style="font-size:.58rem;color:var(--mt);text-transform:uppercase;letter-spacing:1px;margin-top:3px">Avg Edge</div>'
          + '</div>'
          + '<div style="background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center">'
            + '<div style="font-size:1.8rem;font-weight:700;color:var(--mt);line-height:1">' + s.clvCount + '</div>'
            + '<div style="font-size:.58rem;color:var(--mt);text-transform:uppercase;letter-spacing:1px;margin-top:3px">Tracked</div>'
          + '</div>'
        + '</div>'
        + '<div style="font-size:.68rem;color:var(--mt);margin-top:8px;line-height:1.5">'
          + (s.clvPct >= 55 ? '✅ Beating the market consistently — strong long-term indicator.' :
             s.clvPct >= 45 ? '🟡 Roughly matching the market. Aim to beat SP on 55%+ of bets.' :
             '🔴 Losing to the market on most bets. Shop around for better odds earlier.')
        + '</div></div>'
        + '<div style="background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px">'
        + '<div style="font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--mt);margin-bottom:10px">📉 Drawdown & Risk</div>'
        + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">'
          + '<div style="background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center">'
            + '<div style="font-size:1.8rem;font-weight:700;color:var(--re);line-height:1">£' + s.maxDD.toFixed(0) + '</div>'
            + '<div style="font-size:.58rem;color:var(--mt);text-transform:uppercase;letter-spacing:1px;margin-top:3px">Max Drawdown</div>'
          + '</div>'
          + '<div style="background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center">'
            + '<div style="font-size:1.8rem;font-weight:700;color:'+(s.curDD>10?'var(--re)':'var(--mt)')+';line-height:1">£' + s.curDD.toFixed(0) + '</div>'
            + '<div style="font-size:.58rem;color:var(--mt);text-transform:uppercase;letter-spacing:1px;margin-top:3px">Current DD</div>'
          + '</div>'
          + '<div style="background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center">'
            + '<div style="font-size:1.8rem;font-weight:700;color:'+(s.maxLoseStreak>=5?'var(--re)':'var(--mt)')+';line-height:1">' + s.maxLoseStreak + '</div>'
            + '<div style="font-size:.58rem;color:var(--mt);text-transform:uppercase;letter-spacing:1px;margin-top:3px">Worst Streak</div>'
          + '</div>'
        + '</div></div>';
    } else {
      clvEl.innerHTML = '<div style="background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;font-size:.78rem;color:var(--mt)">📈 Add your taken odds and SP when logging bets to unlock CLV tracking and drawdown analysis (' + s.clvCount + '/3 needed).</div>';
    }
  }

  var tEl=document.getElementById('trendWrap');
  if(s.days>=3){
    var tc,tt;
    if(s.last5>2){tc='up';tt='▲ Last 5 bets: +£'+s.last5.toFixed(2)+' — improving';}
    else if(s.last5<-2){tc='dn';tt='▼ Last 5 bets: £'+s.last5.toFixed(2)+' — declining';}
    else{tc='fl';tt='~ Last 5 bets: flat (£'+(s.last5>=0?'+':'')+s.last5.toFixed(2)+')';}
    tEl.innerHTML='<span class="trend '+tc+'">'+tt+'</span>';
  }

  drawChart(d,s);

  if(s.running.length){
    var pk=Math.max.apply(null,s.running);
    document.getElementById('peakNote').textContent='Peak +£'+pk.toFixed(2);
  }

  // Honest insights
  var ins=[];
  var winPct=Math.round(s.winDays/Math.max(s.uniqueDays,1)*100);

  if(s.roi<-10)
    ins.push({c:'ir',t:'🔴 ROI is '+s.roi.toFixed(1)+'% — the app is losing money at a meaningful rate. Worth reconsidering stake size or bet type before continuing.'});
  else if(s.roi<0)
    ins.push({c:'iw',t:'🟡 ROI is '+s.roi.toFixed(1)+'%. Slightly loss-making overall — a few more winning days would tip this positive.'});
  else
    ins.push({c:'ig',t:'🟢 ROI is +'+s.roi.toFixed(1)+'% — currently profitable. Variance is still a factor so keep consistent.'});

  if(winPct<30)
    ins.push({c:'ir',t:'Only '+winPct+'% of days show a profit. Lucky 15s need 2–3 placed horses just to cover the stake — one win and one place is rarely enough unless the odds are long.'});

  if(s.days>=6){
    var early=d.slice(0,Math.floor(d.length/2));
    var late=d.slice(Math.floor(d.length/2));
    var earlyNet=early.reduce(function(s,r){return s+(r.won-r.spent);},0);
    var lateNet=late.reduce(function(s,r){return s+(r.won-r.spent);},0);
    if(lateNet<earlyNet-10)
      ins.push({c:'ir',t:'Performance has got worse over time. First '+early.length+' days: '+(earlyNet>=0?'+':'')+'£'+earlyNet.toFixed(2)+'. Last '+late.length+' days: £'+lateNet.toFixed(2)+'.'});
  }

  var retrains=d.filter(function(r){return r.retrain;});
  if(retrains.length>=2)
    ins.push({c:'ib',t:retrains.length+' model retrains logged (R markers on chart). Results have not improved after retraining — the issue is more likely bet structure than model accuracy.'});

  ins.push({c:'iw',t:'💡 Lucky 15 maths: £1 unit = £15 total. Two 3/1 winners returns ~£8 each from the doubles — barely covering the stake. You need 3+ results, or longer odds, for meaningful profit.'});

  document.getElementById('insightsBox').innerHTML=ins.map(function(i){
    return'<div class="insight '+i.c+'">'+i.t+'</div>';
  }).join('');
}

function drawChart(d,s){
  var cv=document.getElementById('plChart');
  var ctx=cv.getContext('2d');
  var dpr=window.devicePixelRatio||1;
  var W=cv.offsetWidth,H=cv.offsetHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  var pts=s.running;
  if(!pts.length)return;
  var mn=Math.min(0,Math.min.apply(null,pts));
  var mx=Math.max(0,Math.max.apply(null,pts));
  var pd={t:10,r:8,b:24,l:44};
  var cW=W-pd.l-pd.r,cH=H-pd.t-pd.b,rng=(mx-mn)||1;
  function xp(i){return pd.l+(i/Math.max(pts.length-1,1))*cW;}
  function yp(v){return pd.t+cH-((v-mn)/rng)*cH;}
  ctx.strokeStyle='rgba(28,48,36,.6)';ctx.lineWidth=1;
  for(var g=0;g<=4;g++){
    var gv=mn+(mx-mn)/4*g,gy=yp(gv);
    ctx.beginPath();ctx.moveTo(pd.l,gy);ctx.lineTo(W-pd.r,gy);ctx.stroke();
    ctx.fillStyle='rgba(74,106,85,.9)';ctx.font='9px IBM Plex Mono,monospace';ctx.textAlign='right';
    ctx.fillText((gv>=0?'+':'')+'£'+Math.abs(gv).toFixed(0),pd.l-3,gy+3);
  }
  var y0=yp(0);
  ctx.setLineDash([4,4]);ctx.strokeStyle='rgba(74,106,85,.7)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(pd.l,y0);ctx.lineTo(W-pd.r,y0);ctx.stroke();
  ctx.setLineDash([]);
  d.forEach(function(r,i){
    if(!r.retrain)return;
    var x=xp(i);
    ctx.setLineDash([2,3]);ctx.strokeStyle='rgba(64,196,255,.35)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,pd.t);ctx.lineTo(x,H-pd.b);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(64,196,255,.65)';ctx.font='8px IBM Plex Mono,monospace';ctx.textAlign='center';
    ctx.fillText('R',x,pd.t+8);
  });
  ctx.beginPath();
  ctx.moveTo(xp(0),yp(pts[0]));
  pts.forEach(function(v,i){ctx.lineTo(xp(i),yp(v));});
  ctx.lineTo(xp(pts.length-1),y0);ctx.lineTo(xp(0),y0);ctx.closePath();
  var grad=ctx.createLinearGradient(0,pd.t,0,H-pd.b);
  grad.addColorStop(0,pts[pts.length-1]>=0?'rgba(0,230,118,.2)':'rgba(255,82,82,.15)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();
  pts.forEach(function(v,i){i===0?ctx.moveTo(xp(0),yp(v)):ctx.lineTo(xp(i),yp(v));});
  ctx.strokeStyle=pts[pts.length-1]>=0?'#00e676':'#ff5252';
  ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
  pts.forEach(function(v,i){
    ctx.beginPath();ctx.arc(xp(i),yp(v),3.5,0,Math.PI*2);
    ctx.fillStyle=v>=0?'#00e676':'#ff5252';ctx.fill();
  });
  var step=Math.max(1,Math.ceil(pts.length/5));
  d.forEach(function(r,i){
    if(i%step===0||i===pts.length-1){
      var dt=new Date(r.date);
      ctx.fillStyle='rgba(74,106,85,.8)';ctx.font='9px IBM Plex Mono,monospace';ctx.textAlign='center';
      ctx.fillText(dt.getDate()+'/'+(dt.getMonth()+1),xp(i),H-pd.b+13);
    }
  });
}

function renderLog(){
  var d=sortedData().reverse();
  if(!d.length){
    document.getElementById('logCards').innerHTML='<div style="color:var(--mt);font-size:.85rem;padding:20px;text-align:center">No results yet.</div>';
    return;
  }
  // Use index in DATA array as stable key
  var asc=sortedData();
  document.getElementById('logCards').innerHTML=d.map(function(r){
    var idx=DATA.indexOf(r); // original index
    var pl=r.won-r.spent;
    var plStr=(pl>=0?'+':'')+'£'+Math.abs(pl).toFixed(2);
    var dt=new Date(r.date);
    var ds=dt.getDate()+'/'+(dt.getMonth()+1)+'/'+dt.getFullYear();
    var retDot=r.retrain?'<span class="retrain-dot"></span>':'';
    var notes=r.notes?'<div class="day-notes">'+r.notes+'</div>':'';
    // Edit panel pre-filled with current values
    var editPanel=
      '<div class="edit-panel" id="ep_'+idx+'">'
        +'<div class="edit-row">'
          +'<div><div class="fl">Stake £</div>'
            +'<input class="edit-inp gold" id="es_'+idx+'" type="number" min="0" step="0.5" inputmode="decimal" value="'+r.spent.toFixed(2)+'">'
          +'</div>'
          +'<div><div class="fl">Returned £</div>'
            +'<input class="edit-inp gold" id="ew_'+idx+'" type="number" min="0" step="0.01" inputmode="decimal" value="'+r.won.toFixed(2)+'">'
          +'</div>'
        +'</div>'
        +'<div style="margin-bottom:8px"><div class="fl">Notes</div>'
          +'<input class="edit-inp" id="en_'+idx+'" type="text" value="'+((r.notes||'').replace(/'/g,"&#39;"))+'">'
        +'</div>'
        +'<div class="edit-btns">'
          +'<button class="edit-save" onclick="saveEdit('+idx+')">✓ Save</button>'
          +'<button class="edit-cancel" onclick="closeEdit('+idx+')">Cancel</button>'
        +'</div>'
      +'</div>';
    return'<div class="day-card '+(pl>0?'win':'loss')+(r.retrain?' retrain':'')+'" id="dc_'+idx+'" style="flex-wrap:wrap;align-items:flex-start">'
      +'<div style="flex:1;min-width:0">'
        +'<div class="day-date">'+ds+retDot+'</div>'
        +'<div class="day-type">'+r.type+'</div>'
        +notes
      +'</div>'
      +'<div style="text-align:right;flex-shrink:0">'
        +'<div class="day-pl '+(pl>=0?'pos':'neg')+'">'+plStr+'</div>'
        +'<div class="day-stake">Staked £'+r.spent.toFixed(2)+'</div>'
        +'<div class="day-stake">Ret £'+r.won.toFixed(2)+'</div>'
      +'</div>'
      +'<div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0">'
        +'<button class="day-edit" onclick="toggleEdit('+idx+')" title="Edit">✏️</button>'
        +'<button class="day-del"  onclick="delEntry('+idx+')"   title="Delete">✕</button>'
      +'</div>'
      +'<div style="width:100%">'+editPanel+'</div>'
      +'</div>';
  }).join('');
}

function toggleEdit(idx){
  var panel=document.getElementById('ep_'+idx);
  if(!panel)return;
  var isOpen=panel.classList.contains('open');
  // Close all other open panels first
  document.querySelectorAll('.edit-panel.open').forEach(function(p){p.classList.remove('open');});
  if(!isOpen){
    panel.classList.add('open');
    // Focus the returned field since that's most likely what needs fixing
    var ew=document.getElementById('ew_'+idx);
    if(ew){setTimeout(function(){ew.focus();ew.select();},80);}
  }
}

function closeEdit(idx){
  var panel=document.getElementById('ep_'+idx);
  if(panel)panel.classList.remove('open');
}

function saveEdit(idx){
  var r=DATA[idx];
  if(!r)return;
  var newSpent=parseFloat(document.getElementById('es_'+idx).value);
  var newWon  =parseFloat(document.getElementById('ew_'+idx).value)||0;
  var newNotes=document.getElementById('en_'+idx).value.trim();
  if(isNaN(newSpent)||newSpent<=0){alert('Stake must be greater than zero.');return;}
  DATA[idx]=Object.assign({},r,{spent:newSpent,won:newWon,notes:newNotes});
  save();render();renderLog();
}

function delEntry(idx){
  if(!confirm('Delete this entry?'))return;
  DATA.splice(idx,1);
  save();render();renderLog();
}

function addEntry(){
  var date=document.getElementById('fDate').value;
  var spent=parseFloat(document.getElementById('fSpent').value);
  var won=parseFloat(document.getElementById('fWon').value)||0;
  var notes=document.getElementById('fNotes').value.trim();
  var retrain=document.getElementById('fRetrain').checked;
  var oddsIn=parseFloat(document.getElementById('fOdds').value)||0;
  var spIn=parseFloat(document.getElementById('fSP').value)||0;
  if(!date){showStatus('⚠ Select a date.','warn');return;}
  if(isNaN(spent)||spent<=0){showStatus('⚠ Enter your stake.','warn');return;}
  DATA.push({date:date,type:curType,spent:spent,won:won,notes:notes,retrain:retrain,odds:oddsIn,sp:spIn});
  save();
  document.getElementById('fSpent').value='';
  document.getElementById('fWon').value='';
  document.getElementById('fNotes').value='';
  document.getElementById('fOdds').value='';
  document.getElementById('fSP').value='';
  document.getElementById('fRetrain').checked=false;
  var pl=won-spent;
  showStatus('✓ '+(pl>=0?'+':'')+'£'+Math.abs(pl).toFixed(2)+' logged','ok');
  render();
  setTimeout(function(){goTab('overview');},900);
}

function showStatus(msg,type){
  var el=document.getElementById('addStatus');
  el.style.color=type==='ok'?'var(--g)':'var(--gold)';
  el.textContent=msg;
  setTimeout(function(){el.textContent='';},3000);
}

function exportCSV(){
  var d=sortedData();
  var rows=['Date,Type,Stake,Returned,P/L,Retrain,Notes'];
  d.forEach(function(r){
    var pl=(r.won-r.spent).toFixed(2);
    rows.push([r.date,r.type,r.spent.toFixed(2),r.won.toFixed(2),pl,r.retrain?'Yes':'No','"'+(r.notes||'')+'"'].join(','));
  });
  var blob=new Blob([rows.join('\n')],{type:'text/csv'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='bet_results.csv';
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},200);
}

render();
window.addEventListener('resize',function(){render();});
// Sync toggle visual on change
document.getElementById('fRetrain').addEventListener('change',function(){
  var checked=this.checked;
  var track=document.getElementById('toggleTrack');
  var thumb=document.getElementById('toggleThumb');
  if(track)track.style.background=checked?'var(--bl)':'var(--bd)';
  if(thumb)thumb.style.left=checked?'21px':'3px';
});
</script>
